/fed-meeting-today-live-updates.html"}, {"title": "잭슨홀 심포지엄 8월 27~29일 개최…워시 의장 첫 키노트 주목", "summary": "2026년 잭슨홀 경제정책 심포지엄이 8월 27~29일 '금융 혁신: 결제와 정책에 대한 함의'를 주제로 열린다. 케빈 워시 신임 연준 의장이 등판 후 처음으로 이 자리에서 정책 방향을 시사하는 키노트를 전달할 예정이다.", "insight": "정례 FOMC 사이 유일한 정책 신호 창구인 만큼, 8월 28일 전후로 환율·금리 민감 자산의 변동성이 커질 가능성이 높다. 해외 조달·수출 비중이 큰 조직은 해당 주간 전후로 환헤지·가격 정책 의사결정을 미루지 않는 편이 유리하다.", "source_name": "Finance Calendar", "source_url": "https://www.financecalendar.com/event/jackson-hole-economic-symposium-2026/"}, {"title": "글로벌 경제 브리핑: 약한 미 고용지표에 달러·국채금리 동반 하락", "summary": "미국의 예상보다 부진한 고용지표로 달러화와 국채금리가 동반 하락했으며, 이는 신흥국 통화에도 영향을 미쳤다. 연준의 금리 인하 기대가 반영되며 브라질 헤알화 등 고금리 신흥국 통화의 매력이 부각됐다.", "insight": "달러 약세 국면은 원자재·신흥국 조달 비용에는 우호적이지만 해외 매출 환산 이익에는 불리하게 작용할 수 있다. 해외 매출 비중이 높은 사업은 하반기 가이던스 수립 시 환율 시나리오를 보수적(달러 약세)과 중립 두 가지로 나눠 준비하는 것이 안전하다.", "source_name": "Rio Times", "source_url": "https://www.riotimesonline.com/global-economy-briefing-august-8-2026/"}]}, "summary": "반도체 중심 패닉셀로 국내 증시 변동성이 커지는 가운데, OpenAI는 하드웨어·인수·요금정책 전방위 확장으로 대중 소비자 시장 장악을, 마케팅 업계는 AI 에이전트·에이전틱 커머스를 다음 예산 배분의 핵심 축으로 지목하고 있다."}, "2026.08.10": {"date": "2026.08.10", "it": {"domestic": [{"title": "휴머노이드 스타트업 홀리데이로보틱스, 국내 역대 최대 1550억원 시리즈A 유치", "summary": "제조 현장용 휴머노이드 로봇 '프라이데이'를 개발하는 홀리데이로보틱스가 1550억원 규모의 시리즈A를 유치해 국내 스타트업 시리즈A 역대 최대 기록을 세웠다. IMM인베스트먼트, KB인베스트먼트 등이 신규 투자자로 참여했으며, 투자금은 상용화와 대량생산 체계 구축에 투입된다.", "insight": "휴머노이드 투자가 실증 단계를 지나 대량생산 체계 구축 단계로 넘어갔다는 신호로, B2B 제조 로봇 시장의 캐즘 통과 여부를 가늠할 지표로 봐야 한다.", "source_name": "유니콘팩토리", "source_url": "https://www.unicornfactory.co.kr/article/2026071308233216474"}, {"title": "영상 AI 트웰브랩스, 시리즈B 1500억원 유치…누적 투자 3000억원 돌파", "summary": "영상 이해 AI 기업 트웰브랩스가 네이버벤처스와 NEA 공동 주도로 1500억원(1억 달러) 규모의 시리즈B를 유치했다. 아마존이 주요 투자자로 참여하며 누적 투자금은 3000억원을 넘어섰다.", "insight": "빅테크가 직접 투자자로 참여한다는 것은 자체 개발보다 특화 모델을 파트너십으로 확보하려는 전략 전환을 시사하며, 국내 AI 스타트업의 글로벌 파트너십 레퍼런스로 활용 가치가 크다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260702113013"}, {"title": "정부, 나라장터 AI 제품 등록 문턱 낮춰…납품실적 요건 폐지", "summary": "8월 1일부터 AI 제품이 나라장터 종합쇼핑몰에 등록할 때 요구되던 3000만원 이상 납품 실적 요건이 면제되고, 공급업체 수 요건도 3개사에서 1~2개사로 완화됐다. 9월에는 AI 융복합 제품 전용 심사 트랙도 도입될 예정이다.", "insight": "공공조달 진입 장벽 완화는 레퍼런스가 부족한 초기 AI 스타트업에게 공공 섹터를 첫 레퍼런스 고객으로 삼을 기회를 열어주므로, B2G 세일즈 전략을 재검토할 시점이다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260714153908"}], "international": [{"title": "OpenAI, 차세대 모델 '아스트라' 개발·테스트 일시 중단", "summary": "OpenAI가 차세대 모델 아스트라의 사이버보안 위험도가 준비성 프레임워크 상 최고 등급인 '크리티컬' 수준에 도달했다고 밝히며 개발과 테스트를 일시 중단했다. 제로데이 취약점 탐색과 자율적 사이버공격 수행 능력이 우려 요인으로 지목됐다.", "insight": "프론티어 모델의 안전성 검증이 출시 지연으로 직결되는 사례가 늘면서, 자사 제품에 타사 모델을 통합하는 팀은 모델 교체 리스크를 로드맵에 명시적으로 반영해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/07/openai-says-it-slowed-astra-model-development-over-security-concerns/"}, {"title": "앤스로픽, 클로드 전용 자체 AI 반도체 설계팀 신설 공식화", "summary": "앤스로픽이 클로드 모델에 최적화된 커스텀 칩을 설계하는 자체 실리콘팀을 구성 중이라고 처음으로 공식 확인했다. 애플과 구글처럼 하드웨어와 모델을 함께 설계하는 코디자인 전략으로 추론 비용을 크게 낮추는 것이 목표다.", "insight": "AI 랩들이 컴퓨팅 비용을 자체 칩으로 통제하려는 흐름은 API 가격 경쟁력의 다음 승부처가 인프라 수직 통합임을 보여주므로, LLM 벤더 선정 시 장기 가격 전략까지 함께 봐야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/anthropic-is-hiring-an-ai-chip-design-team/"}, {"title": "메타, 대규모 코드베이스용 AI 코딩 에이전트 '뮤즈 코드' 출시", "summary": "메타가 자체 코딩 모델 뮤즈 스파크 기반의 AI 코딩 에이전트 '뮤즈 코드'를 베타로 공개했다. 대형 저장소 작업을 여러 하위 에이전트로 분산 처리하며, OpenAI 코덱스·앤트로픽 클로드 코드보다 저렴한 '컨트리뷰터' 요금제를 내세운다.", "insight": "프롬프트 데이터를 학습에 제공하는 대가로 요금을 대폭 낮추는 모델은 코딩 에이전트 시장에서 가격 경쟁이 데이터 확보 경쟁으로 번지고 있음을 보여주며, 사내 코드 보안 정책 재검토가 필요하다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/meta-launches-muse-code-an-ai-agent-for-large-code-bases/"}]}, "marketing": {"domestic": [{"title": "인크로스, '2026 디지털 마케팅 트렌드' 리포트 발표…핵심은 '콘텐츠·AI'", "summary": "인크로스가 2026년 디지털 마케팅 트렌드 리포트를 통해 콘텐츠와 AI를 핵심 키워드로 제시했다. AI 에이전트 상용화와 파트너십 광고 부상이 주요 흐름으로 꼽혔다.", "insight": "리포트가 공통적으로 'AI 에이전트 상용화'를 지목하는 것은 검색 기반 퍼포먼스 마케팅의 효과가 구조적으로 둔화되고 있다는 신호이므로, 예산 배분 전에 AEO(AI 응답 최적화) 대응 여부를 먼저 점검해야 한다.", "source_name": "매드타임스", "source_url": "https://www.madtimes.co.kr/news/articleView.html?idxno=25996"}, {"title": "모비데이즈, 'MAX SUMMIT 2026' 개최…AI 마케팅 산업 연결 플랫폼 확장", "summary": "모비데이즈가 AI 마케팅 산업 관계자를 연결하는 'MAX SUMMIT 2026'을 개최했다. 광고주와 AI 마케팅 솔루션 기업을 잇는 플랫폼 확장을 발표했다.", "insight": "업계 행사가 '연결 플랫폼'을 자처하는 것은 AI 마케팅 툴 시장이 이미 파편화되어 있다는 반증이므로, 벤더 선정 시 표준 API·데이터 연동 여부를 우선 기준으로 삼아야 한다.", "source_name": "다음뉴스", "source_url": "https://v.daum.net/v/6Dz4M5PKW7"}, {"title": "버즈빌 이관우 대표 \"제로클릭 시대, 광고의 진짜 전장은 노출 이후\"", "summary": "버즈빌 이관우 대표가 제로클릭 시대에는 광고 노출 이후의 인터랙션이 승부를 가른다고 진단하며 대응 전략으로 '인터랙션 AI 에이전트'를 제시했다. AI 요약형 검색이 확산되며 클릭 자체가 줄어드는 현상이 배경으로 지목됐다.", "insight": "제로클릭 확산은 클릭률(CTR) 중심 KPI의 유효성을 근본적으로 흔들고 있어, 마케팅 성과 지표를 노출 후 체류·인터랙션 지표로 전환하는 논의를 지금 시작해야 한다.", "source_name": "테크42", "source_url": "https://www.tech42.co.kr/%ED%98%84%EC%9E%A5-%EC%9D%B4%EA%B4%80%EC%9A%B0-%EB%B2%84%EC%A6%88%EB%B9%8C-%EB%8C%80%ED%91%9C-%EC%A0%9C%EB%A1%9C%ED%81%B4%EB%A6%AD-%EC%8B%9C%EB%8C%80-%EA%B4%91%EA%B3%A0%EC%9D%98-%EC%A7%84/"}], "international": [{"title": "디즈니-틱톡, 세계 최초 글로벌 숏폼 콘텐츠 공유 제휴 발표", "summary": "디즈니와 틱톡이 마블·픽사·스타워즈 등 디즈니 IP를 활용한 크리에이터 영상 제작을 허용하는 글로벌 콘텐츠 제휴를 발표했다. 해당 영상은 틱톡과 디즈니+ 신규 숏폼 피드 '버츠(Verts)'에 동시 게재된다.", "insight": "대형 IP 보유사가 자사 스트리밍이 아닌 틱톡 크리에이터 생태계를 팬 참여의 주 채널로 받아들인 사례로, 콘텐츠 IP를 가진 브랜드라면 자체 채널 고집보다 크리에이터 플랫폼과의 라이선스 협업을 우선 검토할 근거가 된다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/disney-looks-to-tiktok-creators-to-bring-fan-content-to-its-short-form-video-feed/"}, {"title": "옵티마이즐리 조사, 소비자 75% \"내가 받는 마케팅은 나와 무관하다\"", "summary": "옵티마이즐리가 영국 소비자 1000명과 마케터 100명을 조사한 결과, 소비자 75%가 받는 마케팅이 무관하다고 답했다. 61%는 마케팅 과잉에 압도감을 느끼며, 42%는 무관한 콘텐츠에 이탈한다고 답했다.", "insight": "마케터 상당수가 '시간·데이터 부족으로 캠페인을 최적화하지 못한다'고 답한 대목이 핵심으로, 개인화 실패를 툴 문제로 치부하기 전에 캠페인 운영 프로세스와 리소스 배분부터 점검해야 한다.", "source_name": "Retail Times", "source_url": "https://retailtimes.co.uk/three-quarters-of-consumers-say-the-marketing-they-receive-is-irrelevant-optimizely-reports/"}, {"title": "2026년 8월 인플루언서 마케팅 트렌드, 크리에이터 콘텐츠 수요 폭증 속 '진정성'이 희소자원", "summary": "브랜드의 크리에이터 콘텐츠 수요는 계속 커지는 반면 이를 꾸준히 만들어낼 크리에이터 풀은 줄어들고 있다는 분석이 나왔다. 도달보다 진정성이 마케팅 성과를 가르는 희소 자원으로 부상하고 있다.", "insight": "크리에이터 공급이 수요를 못 따라가는 시장에서는 다수 마이크로 인플루언서와의 장기 파트너십이 소수 대형 크리에이터 단발 캠페인보다 비용 대비 진정성 확보에 유리하다.", "source_name": "Newengen", "source_url": "https://newengen.com/insights/influencer-marketing-trends-august-2026/"}]}, "economy": {"domestic": [{"title": "코스피, 반도체주 급락에 4%대 폭락…6,296선 마감", "summary": "삼성전자 6%, SK하이닉스 10% 넘게 급락하며 코스피가 4% 넘게 빠져 6,296대로 마감했다. AMD·샌디스크 등 미국 AI 관련주의 부진한 실적 전망이 뉴욕증시를 거쳐 국내 반도체주에도 영향을 미쳤다.", "insight": "AI 반도체 밸류체인이 국내외로 고도로 연동돼 있어, 미국 빅테크 실적 발표 캘린더를 국내 시장 리스크 관리 일정에도 반영해야 한다.", "source_name": "MBC뉴스", "source_url": "https://imnews.imbc.com/news/2026/econo/article/6842925_36932.html"}, {"title": "\"이틀 만에 12% 날아갔다\"…SK하이닉스, 사상 최대 매출에도 AI 반도체 매도세 심화", "summary": "SK하이닉스가 사상 최대 매출을 기록했음에도 이틀 연속 급락하며 주가가 12% 빠졌다. KB증권은 메모리·기판 등 AI 핵심 부품 수요 이월 현상이 향후 3년간 지속될 것이라며 현재 주가가 과도한 저평가 상태라고 진단했다.", "insight": "실적과 주가가 괴리되는 국면에서는 실적 발표 서프라이즈만으로 시장 내러티브를 바꾸기 어렵다는 점을 감안해, 투자·재무 커뮤니케이션 메시지를 실적 수치보다 수요 사이클 서사에 맞춰야 한다.", "source_name": "Benzinga Korea", "source_url": "https://kr.benzinga.com/news/korea/stocks/%EC%9D%B4%ED%8B%80-%EB%A7%8C%EC%97%90-12-%EB%82%A0%EC%95%84%EA%B0%94%EB%8B%A4%EC%BD%94%EC%8A%A4%ED%94%BC-sk%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4-%EC%82%AC%EC%83%81-%EC%B5%9C"}, {"title": "한국 코스피, 12% 급락하며 하락세 지속…SK하이닉스 20% 폭락", "summary": "코스피가 단기간 12% 급락하며 하락세를 이어갔고, SK하이닉스는 저점 기준 20% 폭락했다. 글로벌 AI 반도체 관련주 조정이 국내 증시 변동성 확대의 주요 배경으로 지목됐다.", "insight": "단일 업종(반도체) 의존도가 높은 코스피 특성상, 포트폴리오·사업 계획 수립 시 반도체 업황을 별도 리스크 팩터로 분리해 관리할 필요가 있다.", "source_name": "Investing.com", "source_url": "https://kr.investing.com/news/stock-market-news/article-2033437"}], "international": [{"title": "美 7월 비농업고용 2.3만명 감소…예상치 크게 밑돌아", "summary": "미국 7월 비농업 고용이 시장 예상(8만명 증가)과 달리 2.3만명 감소했다. 지방정부 교육부문과 소매업이 고용 감소를 주도했으며, 5·6월 고용도 총 10.3만명 하향 조정됐다.", "insight": "고용 서프라이즈가 연준 정책 기대를 즉각 바꾸는 국면에서는 환율·수출 민감 사업의 헤지 전략을 고용지표 발표 주기에 맞춰 재점검해야 한다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/08/07/jobs-report-july-2026.html"}, {"title": "예상 밖 7월 고용 감소에 연준 금리 전망 급변", "summary": "7월 고용 감소 발표 이후 9월 금리 인상 확률이 57%에서 44%로 즉시 하락했다. 리치먼드 연은 총재는 노동시장이 '느슨하지도 팽팽하지도 않은 균형 상태'라고 평가했다.", "insight": "시장의 금리 인상 확률이 데이터 하나로 13%p 급변한 것은 연준 정책에 대한 불확실성이 여전히 크다는 뜻이므로, 자금 조달 계획이 있다면 특정 금리 시나리오에 베팅하기보다 복수 시나리오별 조달 옵션을 준비해야 한다.", "source_name": "Forbes", "source_url": "https://www.forbes.com/sites/eriksherman/2026/08/07/july-jobs-loss-fed-interest-rate-expectations/"}, {"title": "약한 7월 고용지표, 9월 금리인상 가능성 낮춰", "summary": "7월 고용지표 부진이 연준의 9월 금리인상 명분을 약화시켰다는 분석이 나왔다. 다만 고용 감소가 금리인상 가능성을 완전히 배제하지는 못한다는 신중론도 함께 제기됐다.", "insight": "금리인상 가능성이 낮아졌다는 컨센서스와 완전히 배제되지 않았다는 신중론이 공존하는 지금은, 대출·투자 의사결정에서 최악의 시나리오(추가 인상)를 배제하지 않는 보수적 가정이 안전하다.", "source_name": "HousingWire", "source_url": "https://www.housingwire.com/articles/july-2026-jobs-fed-hike/"}]}, "summary": "AI 인프라 투자와 안전성 리스크가 동시에 부각되며 반도체 시장은 실적 호조에도 단기 매도세에 시달렸고, 마케팅 업계는 제로클릭·개인화 실패라는 공통 숙제 앞에서 AI 에이전트 대응을 서두르고 있다."}, "2026.08.11": {"date": "2026.08.11", "it": {"domestic": [{"title": "피지컬AI 데이터 기업 엔닷라이트, 150억원 투자 유치", "summary": "피지컬AI 데이터 인프라 기업 엔닷라이트가 KDB산업은행 리드로 150억원 규모 투자를 유치했다. 네이버 D2SF, IMM인베스트먼트 등 기존 투자자가 후속 투자로 참여했고 NH벤처투자, 스톤브릿지 등이 신규 합류했다.", "insight": "국책은행이 리드 투자자로 나선 것은 피지컬AI 데이터 인프라가 이제 '검증된 산업'으로 분류되기 시작했다는 신호로, 로봇·자율주행 관련 B2B 제품을 준비 중이라면 데이터 확보 파트너로 이런 인프라 기업을 우선순위에 올려야 한다.", "source_name": "와우테일", "source_url": "https://wowtale.net/2026/08/11/262724/"}, {"title": "망고부스트, 글로벌 웹사이트 오픈…'AI 풀스택' 사업 본격화", "summary": "AI 인프라 기업 망고부스트가 글로벌 웹사이트를 새로 열고 서버리스 환경에서 오픈소스 AI 모델의 추론 성능을 최적화하는 'Mango Inference' 플랫폼을 알렸다. 하드웨어부터 추론 서비스까지 아우르는 풀스택 전략을 전면에 내세웠다.", "insight": "추론 비용 최적화를 앞세운 풀스택 전략이 늘어난다는 것은 모델 API 비용이 서비스 마진을 압박하는 단계에 들어섰다는 뜻으로, LLM 기반 제품의 유닛이코노믹스를 다시 점검할 시점이다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260809211129"}, {"title": "빛으로 뇌회로 선택 자극 성공…국산 뇌-컴퓨터 인터페이스 기술 진전", "summary": "국내 연구진이 적외선 파장을 이용해 원하는 뇌 회로만 선택적으로 자극하는 초경량 무선 신경조절 플랫폼 개발에 성공했다. 기존 BCI 대비 침습성을 낮추면서도 정밀도를 높인 것이 특징이다.", "insight": "BCI 하드웨어의 침습성 저하는 상용화 이전 단계인 헬스케어·재활 분야 파일럿 사업의 규제 문턱을 낮추는 요인이므로, 관련 헬스테크 로드맵을 세울 때 임상 승인 일정 단축 가능성을 반영해야 한다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260810135536"}], "international": [{"title": "메타, 대규모 언어모델 '뮤즈 글리머' 공개…온디바이스 개인화 AI 겨냥", "summary": "메타가 소비자 하드웨어에서 로컬로 AI 에이전트를 구동할 수 있는 오픈웨이트 모델 '뮤즈 글리머'를 공개했다. 저커버그가 강조해온 '퍼스널 인텔리전스' 비전의 실체를 보여주는 첫 제품으로 평가된다.", "insight": "클라우드 API 호출 없이 기기 내에서 개인화 추론을 처리하는 모델이 늘어나면, 지금까지 서버 비용 기준으로 설계한 AI 기능의 가격 정책과 데이터 프라이버시 마케팅 메시지를 함께 재검토해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/10/metas-new-glimmer-ai-model-offers-a-hint-at-zuckerbergs-personal-intelligence-vision/"}, {"title": "AI로 저발열 신소재 찾는 스타트업 디스커버드 머티리얼스, 900만달러 시드 유치", "summary": "AI 에이전트로 반도체용 냉각 신소재를 탐색하는 스타트업 디스커버드 머티리얼스가 라이트스피드 인디아 파트너스 주도로 900만달러 시드 투자를 유치했다. AI 반도체 발열 문제 해결을 위한 신소재 발굴에 AI를 적용한 사례다.", "insight": "AI가 소프트웨어를 넘어 소재과학 같은 물리적 R&D 영역까지 파고드는 흐름은 하드웨어 스타트업의 연구개발 주기 단축 가능성을 시사하므로, 딥테크 투자 검토 시 'AI 활용 R&D 속도'를 신규 평가 기준으로 추가할 만하다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/10/discovered-materials-is-playing-ai-whack-a-mole-to-hunt-cooler-chips/"}, {"title": "물류기업 세바 로지스틱스 해킹, 은행·유통·게임업계까지 파장", "summary": "글로벌 물류기업 세바 로지스틱스가 해킹 피해를 입으면서 이 회사에 의존하던 은행, 유통업체, 스팀 게이머 등 다수 고객사의 개인정보가 함께 유출됐다. 공급망 한 지점의 보안 사고가 여러 산업으로 번진 사례다.", "insight": "3자 물류·SaaS 벤더의 보안 사고가 자사 고객 데이터 유출로 직결되는 구조가 반복되고 있어, 외부 파트너 계약 시 보안 감사 조항과 사고 통지 SLA를 필수 항목으로 명시해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/10/a-data-breach-at-shipping-giant-ceva-logistics-is-rippling-across-banks-retailers-steam-gamers-and-beyond/"}]}, "marketing": {"domestic": [{"title": "모비데이즈 'MAX SUMMIT 2026' 개최…AI 마케팅 산업 생태계로 확장", "summary": "모비데이즈가 코엑스에서 'MAX SUMMIT 2026'을 열고 AI가 광고 운영·콘텐츠 제작·커머스 전환 전반을 바꾸는 흐름을 조명했다. 올해는 단순 컨퍼런스를 넘어 브랜드·플랫폼·솔루션 기업이 연결되는 비즈니스 플랫폼으로 행사 성격을 확대했다.", "insight": "업계 대표 행사가 '컨퍼런스'에서 '비즈니스 연결 플랫폼'으로 전환하는 것은 AI 마케팅 툴 시장이 옥석 가리기 단계에 들어섰다는 신호이므로, 벤더 도입 전 실제 도입 사례와 성과 데이터를 요구하는 검증 절차를 강화해야 한다.", "source_name": "매드타임스", "source_url": "https://www.madtimes.co.kr/news/articleView.html?idxno=28181"}, {"title": "네이버·카카오 2분기 실적, 광고·커머스가 견인", "summary": "네이버와 카카오가 2분기 나란히 호실적을 기록한 배경에 광고와 커머스 성장이 자리했다. 카카오는 비즈니스 메시지 중심 광고가 고성장을 이어갔고, 네이버는 피드 확대 효과로 디스플레이 광고가 개선됐다.", "insight": "메신저·포털 공룡의 실적을 광고가 다시 견인하고 있다는 것은 국내 디지털 광고 예산이 여전히 대형 플랫폼에 집중되고 있다는 뜻으로, 신규 채널 실험 예산을 늘리기 전 기존 플랫폼 내 광고 상품 고도화 여지부터 점검하는 편이 ROI 측면에서 안전하다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260708165303"}, {"title": "8월 마케팅 캘린더, 계절 가전·야구 직관·보양식이 핵심 키워드", "summary": "kt나스미디어가 2026년 8월 마케팅 캘린더를 공개하며 야구 직관 먹거리, 말복 보양식, 에어컨 등 계절 가전, 비치웨어를 8월 핵심 소비 키워드로 제시했다. 계절성 이벤트에 맞춘 시즌 캠페인 기획을 제안했다.", "insight": "계절 캘린더형 캠페인은 매년 반복되는 만큼 차별화가 어려워지는 추세이므로, 동일 키워드 안에서도 데이터 기반 마이크로 세그먼트별 메시지 차별화 여부가 캠페인 성과를 가르는 실질적 변수가 된다.", "source_name": "kt나스미디어", "source_url": "https://blog.nasmedia.co.kr/entry/202608-marketing-calendar"}], "international": [{"title": "디즈니-틱톡, 크리에이터에게 마블·픽사 IP 개방하는 파트너십 체결", "summary": "디즈니와 틱톡이 크리에이터들이 디즈니 영화·TV 라이브러리의 클립과 자산을 활용해 숏폼 영상을 만들 수 있도록 허용하는 글로벌 제휴를 발표했다. 결과물은 틱톡과 디즈니+ 양쪽에 게재될 수 있다.", "insight": "대형 IP 보유사가 자체 스트리밍이 아닌 외부 크리에이터 생태계를 팬 콘텐츠 확산 채널로 받아들인 것은, IP를 가진 브랜드라면 자사 채널 통제권을 일부 내려놓더라도 크리에이터 라이선싱으로 도달 범위를 넓히는 전략이 유효하다는 근거가 된다.", "source_name": "CNN Business", "source_url": "https://www.cnn.com/2026/08/05/media/disney-tiktok-partnership"}, {"title": "2026년 마케팅 예측, AI발 양극화가 화두", "summary": "업계 전문가들이 제시한 2026년 마케팅 전망에서 AI가 마케팅 조직을 '데이터·자동화 역량을 갖춘 곳'과 '그렇지 못한 곳'으로 양극화시킬 것이라는 진단이 공통적으로 나왔다. AI 활용도가 곧 조직 경쟁력 격차로 이어질 것이라는 경고다.", "insight": "AI 도입 격차가 조직 역량 격차로 굳어지기 전에, 마케팅팀 내 AI 툴 활용 수준을 표준화하는 온보딩·교육 체계부터 갖추는 것이 장기적으로 캠페인 성과 격차를 줄이는 더 확실한 투자다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/marketing-predictions-for-2026/809124/"}, {"title": "2026년 상반기 최고의 브랜드 캠페인, 공통점은 '솔직함'", "summary": "마케팅다이브가 선정한 2026년 상반기 우수 브랜드 캠페인들의 공통점으로 '정직함'이 꼽혔다. 과거 실수를 인정하거나 대중의 인식을 있는 그대로 받아들이는 방식의 캠페인이 소비자 반응을 이끌어냈다.", "insight": "AI 생성 콘텐츠가 범람하면서 '꾸미지 않은 정직함'이 오히려 희소한 차별화 요소가 되고 있으므로, 브랜드 메시지 전략에서 완벽한 이미지보다 실수를 인정하는 진정성 있는 커뮤니케이션의 비중을 늘리는 것을 검토할 만하다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/best-brand-campaigns-h1-2026-sold-honesty-consumers-buying/819960/"}]}, "economy": {"domestic": [{"title": "코스피로 쏠렸던 자금, 코스닥으로 이동…변동성 장세 지속", "summary": "삼성전자·SK하이닉스에 몰렸던 자금이 반도체 소부장·바이오·로봇 등 코스닥 성장주로 옮겨가고 있다. 기관은 7월 31일 이후 코스닥에서 1조2000억원 넘게 순매수하며 반등을 주도했다.", "insight": "대형 반도체주 쏠림이 완화되고 자금이 분산되는 국면에서는, 반도체 업황 서프라이즈 하나에 사업 전망을 전적으로 연동시키기보다 코스닥 성장주 섹터 동향까지 함께 모니터링하는 것이 리스크 분산에 유리하다.", "source_name": "파이낸셜뉴스", "source_url": "https://www.fnnews.com/news/202608101111578561"}, {"title": "코스피 6,300 턱밑 마감, 코스닥은 7% 급등", "summary": "코스피가 0.7% 오른 6,299.66으로 장을 마쳤고 코스닥은 7% 가까이 오른 854로 마감했다. 삼성전자·SK하이닉스는 소폭 하락한 반면 방산·조선·비철금속 종목은 급등세를 보였다.", "insight": "대형 반도체주는 정체되고 방산·조선 등 다른 섹터가 지수를 견인하는 흐름은 국내 증시의 주도주 교체 신호일 수 있으므로, 소비재·B2B 마케팅 예산 편성 시에도 반도체 업황 외 이들 섹터의 소비 여력 변화를 함께 참고할 필요가 있다.", "source_name": "YTN", "source_url": "https://www.ytn.co.kr/_ln/0102_202608102259587755"}, {"title": "코스피 급락 이후 성난 개인투자자들, \"다시는 안 산다\" 반발", "summary": "최근 코스피 급락으로 손실을 본 국내 개인투자자들이 정부와 정치권을 향해 강한 불만을 표출하고 있다는 외신 보도가 나왔다. 반도체·레버리지 ETF 투자자들의 손실이 두드러졌다.", "insight": "개인투자자의 반도체 레버리지 상품 손실이 사회적 이슈로 번지고 있는 만큼, 금융·투자 관련 서비스라면 고위험 상품 마케팅 문구에 대한 소비자 신뢰 리스크를 지금 재점검해야 한다.", "source_name": "Fortune", "source_url": "https://fortune.com/2026/08/02/kospi-rout-korea-stock-market-volatility-sk-hynix-samsung-ai-leveraged-etf/"}], "international": [{"title": "연준, 7월 FOMC서 기준금리 동결…3명은 인상 표", "summary": "연방준비제도가 7월 FOMC 회의에서 기준금리를 동결하기로 결정했다. 12명 위원 중 9명이 동결에, 3명은 0.25%p 인상에 표를 던지며 내부 이견이 드러났다.", "insight": "위원회 내 인상·동결 표가 팽팽하게 갈리는 상황은 다음 회의에서의 정책 급변 가능성을 배제할 수 없다는 뜻이므로, 환율·금리에 민감한 사업은 단일 시나리오가 아닌 복수 시나리오 기준으로 하반기 예산을 짜야 한다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/07/29/fed-meeting-today-live-updates.html"}, {"title": "엔비디아, 8월 26일 2분기 실적 발표…AI 랠리 향방 가늠자", "summary": "엔비디아가 8월 26일 2026회계연도 2분기 실적을 발표할 예정이다. 시장은 분기 매출이 전년 대비 두 배 가까이 늘어난 약 918억달러에 이를 것으로 전망하고 있다.", "insight": "엔비디아 실적 발표는 AI 투자 열기가 실제 이익으로 이어지는지를 가르는 단일 이벤트로 시장 전체 변동성을 좌우할 수 있으므로, 8월 26일 전후로 예정된 투자 유치·자금 조달 일정은 가급적 피하는 편이 안전하다.", "source_name": "IT AI Totality", "source_url": "https://blog.ai.dmomo.co.kr/news/30972"}, {"title": "파월, 사실상 마지막 잭슨홀 연설 앞두고 시장 주목", "summary": "제롬 파월 연준 의장의 임기 마지막이 될 가능성이 있는 잭슨홀 심포지엄이 8월 27~29일 열린다. 그의 키노트 연설은 8월 28일로 예정돼 있으며 향후 통화정책 방향에 대한 힌트가 나올지 시장이 주목하고 있다.", "insight": "의장 교체를 앞둔 시점의 잭슨홀 연설은 평소보다 정책 시그널의 무게가 커질 수 있어, 하반기 자금 조달이나 해외 매출 비중이 큰 사업은 8월 마지막 주를 환헤지 전략 재점검 시점으로 미리 잡아두는 것이 좋다.", "source_name": "한국경제", "source_url": "https://www.hankyung.com/article/202508186919i"}]}, "summary": "AI 인프라 투자가 피지컬AI·소재과학 등 물리적 영역까지 확장되는 한편, 반도체 쏠림이 완화된 국내 증시와 잭슨홀·엔비디아 실적을 앞둔 글로벌 시장 모두 다음 촉매를 기다리는 관망세가 짙어지고 있다."}, "2026.08.12": {"date": "2026.08.12", "it": {"domestic": [{"title": "지멘스 EDA-엔비디아, 'AI 네이티브' 반도체 설계 협업 확대", "summary": "지멘스 EDA가 서울 포럼에서 엔비디아와 함께 반도체·PCB 설계 전 과정에 AI 에이전트를 결합한 '자가검증형 에이전틱 AI' 워크플로를 공개했다. Fuse EDA AI 에이전트와 엔비디아의 니모트론 추론 모델, NeMo Gym을 결합해 설계 속도와 생산성을 높이는 것이 핵심이다.", "insight": "설계 자동화 영역까지 에이전트가 검증·수정을 스스로 수행하는 흐름은, PM이 제품 개발 리드타임을 산정할 때 하드웨어 설계 주기 단축을 전제로 로드맵을 재조정해야 함을 시사한다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260811161006"}, {"title": "인텔, 21조원 유상증자로 파운드리 승부수", "summary": "인텔이 약 21조원 규모의 유상증자를 결정하며 파운드리 사업 확대에 나섰다. 외부 고객사 확보 여부가 이번 투자의 성패를 가를 핵심 변수로 지목된다.", "insight": "대형 파운드리 자본 경쟁이 격화되는 상황은 위탁생산 단가와 리드타임 협상력에도 영향을 줄 수 있어, 서플라이체인 의존도가 높은 제품팀은 대안 파운드리 확보 계획을 점검할 필요가 있다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260811010216"}, {"title": "'AI 자율보안의 미래' 내건 ISEC 2026, 코엑스서 개막", "summary": "국내 최대 규모의 보안 콘퍼런스 ISEC 2026이 8월 11~12일 서울 코엑스에서 열려 25개 트랙, 120개 이상 세션으로 AI 보안 이슈를 다뤘다. 약 150개 보안기업이 200여 부스로 참가해 1만 명 규모 참관이 예상된다.", "insight": "AI 에이전트가 업무 시스템에 깊게 결합될수록 보안 위협 표면도 커지므로, AI 기능을 제품에 붙이는 PM은 기획 초기부터 보안팀과 위협 모델링을 함께 설계해야 한다.", "source_name": "시선뉴스", "source_url": "https://www.sisunnews.co.kr/news/articleView.html?idxno=237300"}], "international": [{"title": "테크크런치 디스럽트 2026, '리얼월드 AI' 무대 신설", "summary": "테크크런치 디스럽트 2026이 로봇, 자동화 공장, 멸종동물 복원 등을 다루는 'Real World AI Stage'를 새롭게 마련했다. 실드AI, 콜로설 바이오사이언스 등 자율주행을 넘어 실물 공간·전장·가정으로 확장되는 자율 하드웨어 기업들이 연사로 나선다.", "insight": "AI 논의의 축이 소프트웨어 데모에서 물리 세계에 개입하는 하드웨어·자율 시스템으로 옮겨가고 있어, B2B SaaS 중심 PM도 로보틱스·엣지 AI와의 통합 시나리오를 로드맵에 미리 반영해둘 필요가 있다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/techcrunch-disrupt-2026s-real-world-ai-stage-features-robots-automated-factories-and-extinct-animals/"}, {"title": "전 세일즈포스 임원, AI '도입 실패' 문제 해결 스타트업 창업", "summary": "전 세일즈포스 임원 에프라트 라포포트가 마크 베니오프의 투자를 받아 스텔스에서 벗어난 스타트업 'June'을 공개했다. AI가 오히려 전문 서비스 수요를 늘리는 역설, 즉 기업들이 AI 툴을 안정적으로 도입하지 못해 겪는 어려움을 해결하는 데 초점을 맞춘다.", "insight": "'도입(adoption)' 자체가 새로운 시장이 됐다는 신호로, AI 기능을 출시하는 팀은 기능 완성도만큼 온보딩·거버넌스 설계에 리소스를 배분해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/03/a-marc-benioff-backed-startup-thinks-ai-can-solve-the-ai-deployment-problem/"}, {"title": "DARPA·美 공군, AI가 조종한 F-16 실전 비행 성공", "summary": "DARPA와 미 공군이 에글린 공군기지에서 AI가 조종을 맡은 F-16(VENOM) 비행시험에 성공했다고 발표했다. 조종사는 탑승해 감독만 수행했으며, 다수의 자율 항공기를 인간이 총괄 감독하는 차기 단계로 가는 발판이다.", "insight": "미션 크리티컬 영역에서도 'AI가 조작하고 인간이 감독'하는 휴먼-인-더-루프 구조가 표준으로 자리잡고 있어, 리스크가 큰 도메인의 AI 기능 설계 시 참고할 프레임워크다.", "source_name": "DARPA", "source_url": "https://www.darpa.mil/news/2026/darpa-us-air-force-fly-ai-controlled-f-16"}]}, "marketing": {"domestic": [{"title": "[마케띵킹] '챗GPT야, 네가 대신 좀 팔아줘'…에이전틱 커머스 시대", "summary": "오픈애즈가 소비자가 AI 에이전트에게 구매를 직접 위임하는 '에이전틱 커머스' 흐름을 다룬 콘텐츠를 게재했다. 검색·탐색 없이 AI가 대신 상품을 고르고 결제하는 흐름이 빠르게 확산되고 있다는 내용이다.", "insight": "브랜드의 최종 접점이 사람이 아니라 AI 에이전트가 될 수 있다는 전제 아래, 상품 정보·리뷰 데이터를 AI가 파싱하기 쉬운 구조로 정비하는 것이 검색 최적화를 대체할 다음 과제다.", "source_name": "오픈애즈", "source_url": "https://www.openads.co.kr/content/contentDetail?contsId=20102"}, {"title": "NHN, 마케팅 플랫폼 '오픈애즈'를 AI 실무 생산성 툴로 재편", "summary": "NHN애드가 운영하는 콘텐츠 큐레이션 플랫폼 오픈애즈가 AI 기반 실무 생산성 플랫폼으로 리브랜딩됐다고 밝혔다. 콘텐츠 큐레이션에서 나아가 마케터의 실무 자동화까지 지원하는 방향으로 서비스 범위를 넓힌다.", "insight": "인사이트 콘텐츠 플랫폼조차 '읽는 도구'에서 '실행하는 도구'로 진화하고 있다는 점은, 마케팅테크 시장의 다음 차별화 지점이 실행 자동화에 있음을 보여준다.", "source_name": "NHN", "source_url": "https://inside.nhn.com/service/277"}, {"title": "2026년 마케팅 핵심 트렌드, GEO(생성형 엔진 최적화)로 이동", "summary": "국내 마케팅 업계에서 2026년 화두로 참여형 스트리밍, 파트너십 광고, 인터랙션 이코노미와 함께 GEO(Generative Engine Optimization)가 부상하고 있다. 검색 키워드 순위 경쟁을 넘어 AI 검색·추천 엔진에 브랜드가 어떻게 노출되는지가 새로운 성과 지표로 떠올랐다.", "insight": "전통 SEO KPI(검색 순위, 클릭률)만으로는 AI 검색 시대 성과를 설명할 수 없으므로, 마케팅 대시보드에 AI 답변 내 언급 빈도·인용률 같은 GEO 지표를 조기에 추가해야 한다.", "source_name": "오픈애즈", "source_url": "https://openads.co.kr/content/contentDetail?contsId=18383"}], "international": [{"title": "디즈니-틱톡, 크리에이터에 마블·픽사·스타워즈 IP 개방", "summary": "디즈니와 틱톡이 크리에이터에게 마블, 픽사, 스타워즈, FX 등 수백 편의 콘텐츠 자산을 라이선스로 개방하는 첫 파트너십을 발표했다. 참여 크리에이터의 영상은 틱톡과 디즈니+의 신규 숏폼 피드 'Verts'에 동시 노출된다.", "insight": "대형 IP 보유사가 팬 창작물을 공식 광고 소재로 편입시키는 '파트너십 광고' 모델이 본격화되고 있어, 자체 IP·브랜드 자산이 있는 조직은 유사한 크리에이터 라이선싱 프로그램을 검토할 시점이다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/disney-looks-to-tiktok-creators-to-bring-fan-content-to-its-short-form-video-feed/"}, {"title": "링크드인, '협업 게시물' 기능 전 세계 정식 출시", "summary": "링크드인이 최대 5명까지 공동 게시자로 지정해 하나의 게시물을 여러 프로필에 동시 노출할 수 있는 '협업 게시물' 기능을 지난달 글로벌 출시했다. 좋아요·댓글 등 인게이지먼트가 모든 공동 게시자에게 공유된다.", "insight": "B2B 마케터에게는 파트너사·고객사와 공동 발행만으로 도달 범위를 배가할 수 있는 저비용 채널이 생긴 셈이라, 웨비나·고객 성공사례 콘텐츠부터 우선 적용해볼 만하다.", "source_name": "Social Media Today", "source_url": "https://www.socialmediatoday.com/news/linkedin-adds-collaborative-posts/823470/"}, {"title": "세라비X로레알, Z세대 '탠맥싱' 트렌드 겨냥한 SPF 캠페인", "summary": "로레알의 세라비가 배우 타일러 카메론과 피부과 전문의를 앞세워 Z세대의 과도한 태닝 문화('탠맥싱')를 겨냥한 소셜 콘텐츠 시리즈를 시작했다. 미네랄 선크림 신제품을 자연스럽게 노출하며 피부 건강 메시지를 함께 전달한다.", "insight": "유행 문화 코드를 비판하지 않고 그 안에서 대안을 제시하는 방식이 Z세대 대상 캠페인에서 설교조 메시지보다 효과적일 수 있어, 인플루언서·전문가 조합 포맷을 국내 캠페인에도 참고할 만하다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/cerave-tackles-tanmaxxing-in-social-series-to-pitch-gen-z-on-spf/827365/"}]}, "economy": {"domestic": [{"title": "코스피 6345선 마감, 삼성전자 4% 급등에 반도체 수출 훈풍", "summary": "8월 11일 코스피는 전 거래일보다 0.73% 오른 6345.53으로 마감했고 삼성전자는 4%대 강세를 보였다. 외국인과 기관이 각각 순매수에 나선 반면 개인은 5천억원 넘게 순매도했다.", "insight": "반도체 수출 지표와 외국인 수급이 지수를 견인하는 흐름이 이어지고 있어, 국내 IT·제조 기업을 고객으로 둔 B2B 서비스는 하반기 예산 집행 시점을 반도체 업황 사이클에 맞춰 예측하는 것이 유효하다.", "source_name": "국제뉴스", "source_url": "https://www.gukjenews.com/news/articleView.html?idxno=3661780"}, {"title": "집값 상승 기대에 '빚투'까지…5대 은행 가계대출 석달째 증가", "summary": "5대 은행의 가계대출이 석 달 연속 늘었고, 주택가격전망지수는 4년 10개월 만에 최고 수준을 기록했다. 신용대출도 주식 투자 수요 등에 힘입어 증가세를 이어갔다.", "insight": "가계의 가처분소득이 대출 상환과 자산 투자에 더 묶이는 국면은 소비재·구독 서비스의 신규 결제 전환율 둔화로 이어질 수 있어, 프라이싱팀은 하반기 유료 전환 목표를 보수적으로 재점검할 필요가 있다.", "source_name": "글로벌이코노믹", "source_url": "https://www.g-enews.com/article/Finance/2026/08/202608020910182409153ddfb15a_1"}, {"title": "한은, 8월 27일 금통위서 '매파적 동결' 전망 우세", "summary": "우리금융경영연구소 등은 한국은행이 8월 27일 금융통화위원회에서 기준금리 2.75%를 동결할 것으로 전망하면서도, 물가·GDP 전망 상향 조정 가능성에 따라 인상 소수의견이 나올 수 있다고 봤다. 7월 인상 이후 정책 효과를 점검할 시간이 필요하다는 점도 동결 근거로 꼽힌다.", "insight": "금리 인상 사이클이 완전히 끝나지 않았다는 시그널은 스타트업의 브릿지 투자·부채 조달 비용에 계속 부담으로 작용하므로, 자금 조달 계획이 있는 조직은 8월 27일 발표를 주요 체크포인트로 캘린더에 반영해야 한다.", "source_name": "이투데이", "source_url": "https://www.etoday.co.kr/news/view/2611873"}], "international": [{"title": "앤트로픽, 리오트 플랫폼스와 9.1조원 규모 데이터센터 계약", "summary": "AI 기업 앤트로픽이 비트코인 채굴기업 리오트 플랫폼스와 텍사스 록데일 캠퍼스에서 20년간 191MW 규모의 IT 용량을 공급받는 91억달러 계약을 체결했다. 2027년 12월까지 96MW, 2028년 6월까지 전체 191MW를 단계적으로 가동할 계획이다.", "insight": "AI 인프라 확보 경쟁이 전통 클라우드사를 넘어 채굴기업까지로 확장되고 있어, GPU·데이터센터 공급 부족이 예상보다 더 오래 지속될 수 있다는 전제로 AI 제품의 인프라 비용 계획을 세우는 것이 안전하다.", "source_name": "Yahoo Finance", "source_url": "https://finance.yahoo.com/technology/ai/articles/anthropic-signs-9-1-billion-113731732.html"}, {"title": "엔비디아, 월가와 손잡고 AI 인프라에 5000억달러 조달 추진", "summary": "엔비디아가 아폴로, 블랙록, 블랙스톤, 브룩필드, 골드만삭스, KKR 등과 예비 합의를 맺고 AI 인프라 구축을 위한 5000억달러 규모의 자금 조달 플랫폼을 추진한다고 밝혔다. 엔비디아는 이 중 최대 1250억달러(25%)까지 직접 백스톱할 수 있는 옵션을 보유한다.", "insight": "아직 구속력 없는 MOU 단계지만, GPU를 '투자 가능한 자산군'으로 금융화하려는 시도는 AI 컴퓨팅 비용 구조를 장기적으로 바꿀 변수이므로 3~5년 인프라 원가 전망에 시나리오로 반영해둘 만하다.", "source_name": "CNN Business", "source_url": "https://www.cnn.com/2026/08/11/business/nvidia-wall-street-500-billion-financing-intl"}, {"title": "월가, 7월 CPI 발표 앞두고 신중 모드…호르무즈 리스크로 유가 상승", "summary": "미국 증시는 발표를 앞둔 7월 소비자물가지수(CPI)를 앞두고 위험자산 매수를 자제하는 분위기였다. 호르무즈 해협을 둘러싼 에너지 흐름 정상화 합의가 이뤄지지 않으면서 국제유가는 배럴당 83달러를 넘어섰다.", "insight": "인플레이션 지표와 지정학적 유가 리스크가 동시에 연준의 8월 잭슨홀 심포지엄 메시지에 영향을 줄 변수로 떠오른 만큼, 달러 기반 해외 인프라·광고비 예산을 쓰는 조직은 환율·유가 변동성 헤지 시나리오를 미리 준비해야 한다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/08/10/stock-market-today-live-updates.html"}]}, "summary": "AI 인프라를 향한 초대형 자본 베팅(엔비디아·앤트로픽)과 국내 자산시장의 대출 팽창이 동시에 진행되며, 저비용 자금 시대의 종료가 산업 전반의 투자·소비 판단 기준을 다시 쓰고 있다."}, "2026.08.13": {"date": "2026.08.13", "it": {"domestic": [{"title": "AIDC 얼라이언스 출범…\"AI 데이터센터는 지능 수출 공장\"", "summary": "과학기술정보통신부와 400여개 기업·기관이 서울 롯데호텔에서 'AIDC 얼라이언스' 출범식을 열었다. AI 데이터센터를 단순 인프라가 아닌 설계·전력·냉각·반도체·클라우드 기술을 묶어 해외에 수출하는 국가전략산업으로 육성한다는 구상이다.", "insight": "정부가 AIDC를 수출산업으로 규정한 만큼, AI 인프라를 활용하는 서비스 기획자는 국내 데이터센터 증설 로드맵과 전력 수급 이슈가 향후 GPU 단가·리드타임에 미칠 영향을 미리 점검해야 한다.", "source_name": "아이뉴스24", "source_url": "http://inews24.com/view/1989979"}, {"title": "카카오, '쿠팡이츠'로 에이전트 AI 첫 구현…검색광고까지 확장", "summary": "카카오가 에이전트 AI 연동 첫 파트너로 쿠팡이츠를 선정해 카카오톡 안에서 AI가 주문·결제까지 처리하는 환경을 구축했다. 올해는 이용자 확보와 에이전트 연결 확대에 집중하고, 내년부터 검색광고 등으로 수익화를 확대할 계획이다.", "insight": "네이버는 AI 광고로 즉시 수익화를, 카카오는 거래 연동 후 수익화를 택해 시점이 엇갈렸다. 자사 서비스에 AI 에이전트를 붙일 때도 '선 확산-후 수익화'와 '선 수익화' 중 조직의 캐시플로 여력에 맞는 전략을 명확히 선택해야 한다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260806111654"}, {"title": "\"한국 개발자는 세계 최고 수준\"…애플, AI 개발도구 앞세워 글로벌 진출 지원", "summary": "애플이 한국을 '세계에서 가장 역동적인 개발자 커뮤니티'로 평가하며, 엑스코드에서 앤트로픽·구글·오픈AI 모델을 코딩에 직접 활용할 수 있는 환경을 지원한다고 밝혔다. 포항 애플 디벨로퍼 아카데미는 현재까지 1000명 이상의 수료생을 배출했다.", "insight": "빅테크가 특정 모델에 락인되지 않는 멀티 LLM 개발 환경을 표준으로 제시하고 있다. 자체 AI 기능을 설계할 때도 특정 벤더 종속을 피하고 모델 교체 가능성을 아키텍처에 반영하는 것이 리스크 관리 측면에서 유리하다.", "source_name": "아이뉴스24", "source_url": "http://inews24.com/view/1989986"}], "international": [{"title": "IBM-Together AI, 2400억원 규모 오픈소스 AI 추론 클러스터 구축", "summary": "IBM과 Together AI가 엔비디아 HGX B300 시스템 기반의 대규모 AI 추론 클러스터를 IBM 클라우드에 구축하는 다년 계약을 체결했다. 오픈소스 모델로 폐쇄형 프론티어 모델과 유사한 성능을 더 낮은 토큰 비용에 제공하는 것이 목표로, 가동은 2027년 1분기 예정이다.", "insight": "오픈소스 모델 + 전용 추론 인프라 조합이 빅테크 API 대비 비용 경쟁력을 갖추기 시작했다는 신호다. AI 기능의 단가가 중요한 대규모 트래픽 제품이라면 오픈소스 모델 전환 시점을 로드맵에 미리 검토해둘 만하다.", "source_name": "Techzine Global", "source_url": "https://www.techzine.eu/news/infrastructure/143545/ibm-builds-240-million-inference-cluster/"}, {"title": "구글 AMIE, 실시간 원격 진료 AI 최초로 전문의 수준 성능 입증", "summary": "구글의 연구용 의료 AI 'AMIE'가 100개 시나리오·300건의 실시간 화상 진료를 대상으로 한 다중군 무작위 연구에서 병력 청취, 진단 정확도, 커뮤니케이션 등 핵심 임상 역량에서 전문의 수준 평가를 받았다. 다만 실제 환자 대상 연구는 아직 남은 과제다.", "insight": "AI가 텍스트 상담을 넘어 비언어적 신호를 읽는 실시간 화상 상담까지 도달했다는 것은, 헬스케어·상담·고객지원처럼 '대면성'을 경쟁력으로 여겼던 서비스 영역도 AI 대체 시나리오를 재검토해야 함을 뜻한다.", "source_name": "Google Blog", "source_url": "https://blog.google/innovation-and-ai/models-and-research/google-research/amie-video-consultations/"}, {"title": "마크 베니오프 투자 스타트업, 'AI 배포 문제'를 AI로 해결한다", "summary": "세일즈포스 CEO 마크 베니오프가 투자한 스타트업이 기업의 AI 도입 시 병목이 되는 '배포·운영' 단계를 자동화하는 솔루션을 내놨다. 모델 성능보다 실제 조직에 붙이는 과정에서 발생하는 마찰이 AI 도입의 실질적 장벽임을 짚었다.", "insight": "많은 기업이 '어떤 모델을 쓸지'에 집중하지만 실제 병목은 배포·거버넌스·모니터링 단계에 있다. AI 기능 기획 초기부터 배포 파이프라인과 운영 체계를 함께 설계하지 않으면 PoC 이후 스케일업 단계에서 막힐 가능성이 크다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/03/a-marc-benioff-backed-startup-thinks-ai-can-solve-the-ai-deployment-problem/"}]}, "marketing": {"domestic": [{"title": "네이버는 AI 광고, 카카오는 AI 거래…엇갈린 수익화 시계", "summary": "네이버는 AI 브리핑에 광고를 붙여 즉시 매출을 창출하는 전략을, 카카오는 에이전트 기반 거래·결제 생태계를 먼저 확장한 뒤 내년부터 수익화하는 전략을 택했다. 두 회사의 AI 수익화 시점과 방식이 뚜렷하게 갈리고 있다.", "insight": "AI 기능의 수익모델을 설계할 때 '광고형 즉시 수익화'와 '거래형 지연 수익화' 중 하나를 택해야 하며, 어느 쪽이든 사용자 경험 저해 없이 수익화 지점을 자연스럽게 녹이는 UX 설계가 성패를 가른다.", "source_name": "네이트뉴스", "source_url": "https://news.nate.com/view/20260808n04614?mid=n0100"}, {"title": "2026년 광고시장, 성장과 조정의 갈림길…디지털 중심 재편 가속", "summary": "한국방송광고진흥공사(코바코)가 2026년 국내 광고시장이 디지털·리테일미디어 중심으로 재편되며 매체 간 양극화가 심화되고 있다고 진단했다. 온라인 광고 비중이 전체의 약 60%에 달하는 반면 방송광고는 전년 대비 약 13% 감소했다.", "insight": "예산 배분 관점에서 브랜드/퍼포먼스 마케터 모두 리테일미디어·인앱 광고 비중을 구조적으로 늘려야 하는 시점이다. 방송·전통 매체 의존도가 높은 브랜드는 전환 속도가 늦을수록 매체 효율 격차가 벌어질 위험이 크다.", "source_name": "한국방송광고진흥공사(KOBACO)", "source_url": "https://www.kobaco.co.kr/site/main/board/news/24646"}, {"title": "한국디지털광고협회, '2026 대한민국 대학생 디지털 광고제' 개최", "summary": "한국디지털광고협회가 생성형 AI를 활용한 숏폼 콘텐츠로 지역문화를 알리는 대학생 대상 광고 공모전 'KUDAF 2026'을 개최한다. 9월까지 접수 후 예선·본심을 거쳐 12월 시상식을 진행한다.", "insight": "업계 협회 차원에서 '생성형 AI 활용'을 공모 필수 조건으로 못 박은 것은 숏폼·생성형 AI 제작이 이미 신입 마케터의 기본 역량으로 자리잡았다는 신호다. 주니어 채용 시 AI 툴 활용 포트폴리오를 평가 기준에 포함할 필요가 있다.", "source_name": "한국대학신문", "source_url": "https://news.unn.net/news/articleView.html?idxno=593224"}], "international": [{"title": "디즈니-틱톡, 사상 최초 글로벌 숏폼 콘텐츠 제휴 발표", "summary": "디즈니와 틱톡이 크리에이터가 디즈니·픽사·마블·스타워즈·FX의 라이선스 캐릭터와 장면을 활용해 숏폼 영상을 제작할 수 있는 글로벌 제휴를 발표했다. 옵트인한 영상은 틱톡과 디즈니+ 신설 세로형 피드 'Verts'에 동시 노출되며, 미국 시장 우선 시범 운영 후 확대할 계획이다.", "insight": "레거시 IP 보유 기업이 크리에이터 생태계를 '통제된 라이선스'로 개방하는 방식이 새로운 표준이 될 수 있다. 브랜드 IP를 가진 기업이라면 무단 2차 창작 단속보다 공식 라이선스 개방을 통한 팬덤 콘텐츠 확산 전략을 검토할 시점이다.", "source_name": "The Walt Disney Company", "source_url": "https://thewaltdisneycompany.com/news/tiktok-content-sharing-deal/"}, {"title": "옵티마이즐리 조사, 소비자 75% \"받는 마케팅이 무관하다\"", "summary": "옵티마이즐리가 영국 소비자 1000명과 마케터 100명을 조사한 결과, 소비자의 75%가 자신이 받는 마케팅 메시지를 '무관하다'고 느꼈다. 마케터의 66%는 여러 툴·플랫폼 관리로 인한 비효율을, 60%는 데이터·시간 부족 속 캠페인 실행 압박을 호소했다.", "insight": "개인화 기술 투자가 늘어도 소비자 체감 관련성은 오히려 낮아지고 있다는 것은 '타겟팅 정교화'보다 '메시지 빈도·피로도 관리'가 더 시급한 문제일 수 있음을 시사한다. 캠페인 성과 지표에 도달률뿐 아니라 피로도·구독해지율을 함께 추적해야 한다.", "source_name": "PR Newswire (Optimizely)", "source_url": "https://www.prnewswire.com/news-releases/new-optimizely-research-reveals-growing-gap-between-ais-efficiency-promises-and-marketing-reality-302814574.html"}, {"title": "\"CMO가 조직 내 AI 활용도가 가장 낮다\"…애드위크 조사", "summary": "애드위크가 뉴턴X와 함께 500명의 마케팅 업계 종사자를 조사한 결과, 응답자의 81%가 '마케터들이 자신의 AI 역량을 과대평가한다'고 답했고 47%는 '시니어 리더십이 오히려 AI 활용에서 가장 뒤처진다'고 답했다. 가트너 조사에서도 CEO의 15%만이 자사 CMO의 AI 역량을 신뢰한다고 밝혔다.", "insight": "AI 전환의 최대 병목이 실무진이 아니라 의사결정권자의 AI 이해도 부족일 수 있다는 데이터다. 조직 내 AI 도입을 추진하는 PM이라면 실무자 교육보다 리더십 대상 AI 리터러시 세션을 우선순위로 배치하는 것이 전환 속도를 높이는 데 더 효과적일 수 있다.", "source_name": "Adweek", "source_url": "https://www.adweek.com/brand-marketing/cmos-are-the-least-proficient-at-ai-in-the-marketing-org-research-finds/"}]}, "economy": {"domestic": [{"title": "코스피 3.68% 급등 마감…코스닥은 강보합", "summary": "12일 코스피 지수가 전 거래일 대비 3.68% 급등한 6,579.04에 장을 마쳤고, 코스닥은 0.12% 오른 858.91로 강보합 마감했다. 원·달러 환율은 오후 3시 30분 기준 1,415.7원을 기록했다.", "insight": "단기 급등은 미국 CPI 발표를 앞둔 수급 쏠림일 가능성이 있어, 소비재·플랫폼 기업의 IR·마케팅 예산 집행 시점을 주가 변동성에 연동시키는 것은 과도한 노이즈에 의사결정을 맡기는 리스크가 있다.", "source_name": "다음뉴스", "source_url": "https://v.daum.net/v/20260812153640706"}, {"title": "거래소, 동전주·시총미달 36개 종목 관리종목 지정", "summary": "한국거래소가 30거래일 연속 주가 1000원 미만이거나 시가총액 기준(코스피 3000억·코스닥 2000억)에 미달한 36개 종목을 관리종목으로 지정했다. 이 중 30개는 신규 지정이며, 90거래일 중 45거래일 이상 기준 미충족 시 상장폐지 대상이 된다.", "insight": "7월부터 시행된 개정 상장 규정의 첫 대규모 적용 사례로, 좀비 상장사 정리가 본격화되고 있음을 보여준다. 소형주 관련 서비스(증권 앱, 투자 커뮤니티 등)를 운영한다면 관리종목 리스트 변동을 실시간 알림 기능에 반영할 필요가 있다.", "source_name": "머니투데이", "source_url": "https://www.mt.co.kr/stock/2026/08/12/2026081217183363483"}, {"title": "한은, 2027년 금통위 일정 발표…기준금리 현재 2.75%", "summary": "한국은행이 2027년 첫 기준금리 결정을 1월 15일로 하는 금융통화위원회 일정을 발표했다. 앞서 7월 16일 금통위에서 기준금리는 2.50%에서 2.75%로 인상됐으며, 다음 결정은 8월 27일 예정이다.", "insight": "인상 기조 전환은 소비자 대출·카드론 의존도가 높은 커머스·핀테크 서비스의 결제 전환율에 영향을 줄 수 있다. 8월 27일 금통위 결과에 따라 프로모션·할부 정책의 시나리오를 이원화해 미리 준비해두는 것이 안전하다.", "source_name": "이데일리", "source_url": "https://marketin.edaily.co.kr/News/ReadE?newsId=04979046642338168"}], "international": [{"title": "미 7월 CPI 3.4%로 둔화…9월 금리 인상 가능성은 여전", "summary": "미국 7월 소비자물가지수(CPI)가 전년 대비 3.4% 상승해 전월(3.5%)보다 둔화됐고, 근원 CPI도 2.5%로 낮아졌다. 다만 제롬 파월 후임 케빈 워시 연준 의장은 인플레이션이 예상보다 뜨거울 경우 9월 금리 인상 가능성을 열어두고 있다.", "insight": "금리 인하가 아닌 '추가 인상 가능성'이 논의되는 국면 전환은, 스타트업의 자금 조달 환경이 당초 기대보다 더 늦게 완화될 수 있음을 시사한다. 시리즈 투자 유치를 준비 중인 조직이라면 밸류에이션 협상 시나리오를 보수적으로 재설정해야 한다.", "source_name": "Trading Economics", "source_url": "https://tradingeconomics.com/united-states/inflation-cpi"}, {"title": "연준, 7월 FOMC서 금리 동결…3대 1 인상 소수의견", "summary": "연준이 7월 29일 FOMC에서 기준금리를 동결했으며, 12명 위원 중 3명은 0.25%p 인상을 주장했다. 7월 비농업 고용은 예상(8만명 증가)과 달리 2만3000명 감소했지만 실업률은 4.1%로 하락해 S&P500은 사상 최고치를 기록했다.", "insight": "고용 둔화와 물가 재상승이 동시에 나타나는 스태그플레이션 초기 신호는, 원가 상승분을 가격에 전가하기 어려운 구독형 서비스에는 이중 압박이다. 가격 정책 담당자는 단순 인상보다 티어 재구성을 통한 우회 전가 방안을 검토할 시점이다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/07/29/fed-meeting-today-live-updates.html"}, {"title": "미 증시, CPI 발표 앞두고 숨고르기…나스닥 0.6% 하락", "summary": "12일(현지시간) S&P500은 0.32%, 다우는 0.34% 하락했고 대형 기술주 약세로 나스닥은 0.6% 내렸다. 시장은 13일 발표될 CPI 지표가 연준의 다음 행보를 좌우할 핵심 변수가 될 것으로 보고 관망세를 유지했다.", "insight": "CPI 발표를 앞둔 대형 기술주 조정은 해외 진출·글로벌 마케팅 예산을 달러 기준으로 집행하는 조직에는 환헤지 타이밍 리스크로 이어진다. 단기 지표 발표 전후로는 대규모 해외 광고 집행 계약 체결 시점을 분산시키는 것이 안전하다.", "source_name": "STL.News", "source_url": "https://www.stl.news/overseas-stock-markets-august-12-2026/"}]}, "summary": "AI 인프라·에이전트 수익화 경쟁이 국내외에서 동시에 본격화되는 가운데, 미 CPI 발표를 앞둔 관망세와 한은의 인상 기조 전환이 겹치며 금리 불확실성이 소비·마케팅 예산 집행의 새 변수로 떠오른 하루다."}, "2026.08.14": {"date": "2026.08.14", "it": {"domestic": [{"title": "생성형 AI 개인정보 국외이전, 안전조치 점검 시급", "summary": "챗봇 프롬프트에 입력된 개인정보가 해외 서버로 이전되는 구조적 문제가 다시 제기됐다. 전문가들은 기업들이 생성형 AI 도입 속도에 비해 국외이전 안전조치 검증이 뒤처져 있다고 지적한다.", "insight": "AI 기능을 제품에 붙이기 전에 데이터 흐름과 국외이전 근거를 먼저 확인해야 한다. PM은 법무·보안 검토를 기능 출시 체크리스트의 선행 단계로 못박아야 리스크를 줄일 수 있다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260813164711"}, {"title": "메타, APAC서 '라이브 커머스' 기능 강화", "summary": "메타가 아시아태평양 지역에서 라이브 스트리밍 중 즉시 구매가 가능한 라이브 커머스 기능을 확대한다. AI 기반 상품 추천과 결제 연동을 통해 시청에서 구매까지 이어지는 경로를 단축하는 것이 핵심이다.", "insight": "숏폼·라이브 콘텐츠 내 구매 전환율은 이제 플랫폼 경쟁의 핵심 지표가 됐다. 국내 서비스도 콘텐츠-커머스 연결 고리를 얼마나 매끄럽게 만드는지가 다음 성장 동력이 될 것이다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260813171548"}, {"title": "아이티센클로잇, AI 에이전트 'AgentGo'로 영업익 16배 급증", "summary": "아이티센클로잇이 자체 AI 에이전트 플랫폼 'AgentGo'를 제약·제조·금융 등 업무 자동화에 적용하며 상반기 영업이익이 전년 대비 16배 증가했다고 밝혔다.", "insight": "범용 LLM보다 특정 업무 프로세스에 특화한 에이전트가 실제 수익으로 이어지는 사례다. AI 전략을 짤 때 '어떤 업무를 대체하는가'를 먼저 정의하는 것이 매출로 가는 지름길임을 보여준다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260813165055"}], "international": [{"title": "xAI, 장기 에이전트 작업 겨냥한 'Grok 4.6' 출시", "summary": "xAI(SpaceXAI)가 8월 12일 코딩과 멀티스텝 에이전트 작업에 최적화한 'Grok 4.6'을 공개했다. 가격은 기존 4.5와 동일하게 유지하면서 장기 실행 작업에서의 성능을 끌어올렸다.", "insight": "프론티어 모델 간 성능 격차가 좁혀지면서 가격 동결로 경쟁하는 국면이다. 제품에 LLM을 붙이는 팀은 특정 모델 종속보다 멀티모델 전환 가능한 아키텍처를 우선순위로 둬야 한다.", "source_name": "x.ai", "source_url": "https://x.ai/news/grok-4-6"}, {"title": "AWS, Continuum 보안 플랫폼을 Claude Code·Codex에 통합", "summary": "AWS가 Black Hat USA 2026에서 코드 취약점 탐지 플랫폼 'Continuum'을 앤트로픽 Claude Code, 오픈AI Codex, 자사 Kiro IDE에 통합한다고 발표했다. 개발자가 어떤 AI 코딩 툴을 쓰든 실시간으로 보안 검증을 받게 된다.", "insight": "AI 코딩 도구의 다음 경쟁 축은 '생성 속도'가 아니라 '생성된 코드의 보안'으로 이동하고 있다. 개발 조직은 AI 코딩 도입과 동시에 보안 게이트를 파이프라인에 내장해야 한다.", "source_name": "VentureBeat", "source_url": "https://venturebeat.com/security/aws-continuum-integrates-with-openai-codex-and-anthropic-claude-code-in-major-ai-security-push"}, {"title": "데이터센터 100조원 IPO 추진 등 AI 인프라 투자 가속", "summary": "한 데이터센터 기업이 100조원 규모 IPO를 검토하고, AI 스타트업들은 40조원대 밸류에이션을 향해 질주하고 있다. 인도는 역대 최대 규모 GPU 도입을 추진하는 등 AI 인프라 투자가 전방위로 확대되고 있다.", "insight": "AI 경쟁의 무게중심이 모델에서 인프라·전력·자본조달로 옮겨가고 있다. 국내 기업도 컴퓨팅 확보 전략 없이는 다음 라운드 AI 경쟁에서 밀릴 수 있다는 신호다.", "source_name": "Tech Startups", "source_url": "https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}]}, "marketing": {"domestic": [{"title": "인크로스, 'CAPEX' 키워드로 2026 디지털 마케팅 트렌드 발표", "summary": "인크로스가 콘텐츠와 AI의 결합을 뜻하는 'CAPEX(Content & AI Powered Experience)'를 내년 핵심 키워드로 제시했다. 크리에이터 믹스, AI 프로듀싱, GEO 등 5가지 하위 트렌드를 함께 소개했다.", "insight": "대중 트렌드가 사라지고 취향 중심의 나노 트렌드가 부상한다는 진단은 타겟팅 전략 자체를 재설계하라는 신호다. 플랫폼 단위가 아닌 크리에이터 채널 단위로 예산 배분 기준을 다시 짜야 한다.", "source_name": "디지털인사이트", "source_url": "https://ditoday.com/인크로스-2026-디지털-마케팅-트렌드-리포트-발표/"}, {"title": "나스미디어, 2026 디지털 미디어&마케팅 4대 전망 제시", "summary": "나스미디어는 인앱 전략과 경험 루프, AI 에이전트 상용화, 참여형 스트리밍 확대, 파트너십 광고 부상을 2026년 핵심 트렌드로 꼽았다.", "insight": "'파트너십 광고'로의 이동은 크리에이터 콘텐츠를 공식 광고 소재로 승인하는 워크플로우가 필요하다는 뜻이다. 마케팅 조직은 크리에이터 계약·IP 사용 프로세스를 지금부터 표준화해둬야 한다.", "source_name": "kt나스미디어", "source_url": "https://www.nasmedia.co.kr/정기보고서/2025년-12월-2026-디지털-미디어-마케팅-전망/"}, {"title": "오픈애즈, '2026년 꼭 알아야 할 마케팅 트렌드 10' 공개", "summary": "오픈애즈가 루프 설계형 광고, 인터랙션 이코노미, GEO(생성형 엔진 최적화) 등을 포함한 10대 마케팅 트렌드를 정리해 발표했다.", "insight": "SEO에서 GEO로의 전환은 검색 엔진이 아니라 AI 답변에 노출되는 콘텐츠 설계가 필요하다는 뜻이다. 콘텐츠팀은 키워드 최적화 대신 '생성형 AI가 인용할 만한 근거 콘텐츠' 제작으로 방향을 틀어야 한다.", "source_name": "오픈애즈", "source_url": "https://openads.co.kr/content/contentDetail?contsId=18383"}], "international": [{"title": "디즈니-틱톡, 크리에이터 콘텐츠 라이선스 파트너십 체결", "summary": "디즈니와 틱톡이 마블, 스타워즈, 픽사 등 IP를 크리에이터가 공식적으로 활용해 숏폼 영상을 제작할 수 있는 글로벌 파트너십을 발표했다. 제작된 영상은 틱톡과 디즈니+의 숏폼 피드 '버츠'에 동시 노출된다.", "insight": "대형 IP 보유사가 '단속'에서 '라이선스 개방'으로 전략을 바꾼 상징적 사례다. IP 기반 서비스라면 크리에이터의 2차 창작을 막을지 공식 채널로 흡수할지를 지금 결정해야 한다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/disney-tiktok-partner-on-content-sharing-as-creators-fuel-fandom/827054/"}, {"title": "인플루언서 마케팅, '크리에이터 공급 부족'이 핵심 변수로", "summary": "브랜드의 크리에이터 콘텐츠 수요는 늘고 있지만, 안정적으로 콘텐츠를 제작할 수 있는 크리에이터 풀은 오히려 줄고 있다는 분석이 나왔다. 이제 진정성 있는 콘텐츠가 도달률보다 희소한 자원이 되고 있다.", "insight": "크리에이터 소싱을 단발성 캐스팅이 아니라 장기 파트너십으로 관리해야 공급 리스크를 줄일 수 있다. 마케팅팀은 크리에이터 관계를 '광고 집행'이 아닌 '공급망 관리'의 관점으로 봐야 한다.", "source_name": "Newengen", "source_url": "https://newengen.com/insights/influencer-marketing-trends-august-2026/"}, {"title": "에이전틱 커머스 부상 속 \"마케팅이 무관하다\" 응답 75%", "summary": "8월 둘째 주 마케팅 트렌드 정리에 따르면 소비자 75%가 자신이 접하는 마케팅을 무관하다고 답한 설문 결과가 나왔고, 동시에 AI 쇼핑 에이전트를 활용한 에이전틱 커머스가 빠르게 확산되고 있다.", "insight": "구매 결정을 AI 에이전트가 대신하는 환경에서는 소비자 개인이 아니라 '에이전트가 신뢰하는 데이터 신호'를 최적화하는 것이 새로운 마케팅 과제가 된다. 상품 메타데이터·리뷰·정책 정보의 구조화가 광고 소재만큼 중요해진다.", "source_name": "b2the7", "source_url": "https://www.b2the7.com/news-blog/marketing-trends-august-10-2026"}]}, "economy": {"domestic": [{"title": "환율·물가 안정에도 한은 8월 금리 '딜레마'", "summary": "원·달러 환율이 1410원대로 내려오고 7월 소비자물가도 2%대로 둔화하면서 한은의 연속 인상 압박은 다소 완화됐다. 그러나 예상보다 강한 성장세로 8월 27일 금통위의 결정은 여전히 안갯속이다.", "insight": "물가·환율 지표만으로 금리 방향을 단정하기 어려운 국면이다. 소비재·핀테크 서비스는 인상·동결 두 시나리오 모두를 가정한 자금조달·가격 전략을 준비해둬야 한다.", "source_name": "아주경제", "source_url": "https://www.ajunews.com/view/20260807153033307"}, {"title": "반도체 투매發 코스피 서킷브레이커, 올해 8번째 발동", "summary": "중국 CXMT 상장과 AI 관련 순환출자 우려로 반도체주가 급락하며 코스피에 매도 사이드카에 이어 1단계 서킷브레이커가 발동됐다. 삼성전자·SK하이닉스가 각각 11~12%대 급락하며 지수 하락을 주도했다.", "insight": "반도체 두 종목 비중이 지나치게 높은 코스피 구조 자체가 변동성의 근원이다. 반도체 의존 산업의 사업계획은 주가 서프라이즈와 실적 서프라이즈가 반대로 움직일 수 있음을 전제로 짜야 한다.", "source_name": "YTN", "source_url": "https://www.ytn.co.kr/_ln/0102_202607281148467807"}, {"title": "삼성전자·SK하이닉스 사상 최대 실적에도 주가는 급락", "summary": "삼성전자는 2분기 매출 133조원·영업이익 57조원, SK하이닉스는 영업이익 60조원대에 이르는 사상 최대 실적을 냈지만 정작 주가는 급락했다. 반도체 편중 지수 구조와 레버리지 ETF발 기계적 매도가 원인으로 지목됐다.", "insight": "'실적 서프라이즈=주가 상승' 공식이 깨지는 시장에서는 IR·커뮤니케이션 전략도 재설계가 필요하다. 실적 발표 시점에 밸류에이션 눈높이와 매크로 리스크를 함께 설명하지 않으면 오히려 신뢰를 잃을 수 있다.", "source_name": "Daum(SBS 스프)", "source_url": "https://v.daum.net/v/1K0TCLiPua"}], "international": [{"title": "美 연준, 7월 FOMC서 금리 동결…3명은 인상 주장", "summary": "연준이 7월 28~29일 FOMC에서 기준금리를 3.5~3.75%로 동결했다. 위원 9명이 동결에, 3명이 0.25%p 인상에 투표하며 이례적으로 표가 갈렸다.", "insight": "위원 간 이견이 커졌다는 것은 다음 회의 결과 예측 가능성이 낮아졌다는 뜻이다. 해외 조달·환헤지 계획이 있는 조직은 금리 시나리오를 단일 전망이 아니라 분포로 관리해야 한다.", "source_name": "Federal Reserve", "source_url": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm"}, {"title": "국제유가, OPEC·IEA 수요전망 하향에 급락", "summary": "IEA가 8월 보고서에서 올해 세계 석유 수요 증가폭을 하루 160만 배럴 감소로 하향 조정하면서 WTI·브렌트유가 나란히 2%대 하락했다.", "insight": "에너지 비용 하락은 물류·제조 원가에는 우호적이지만 산유국 경기 둔화를 통해 신흥국 수요에는 부정적 신호가 될 수 있다. 글로벌 확장을 준비하는 서비스는 유가 하락을 '원가 개선'으로만 해석하지 말고 타깃 시장 구매력 변화도 함께 봐야 한다.", "source_name": "파이낸셜뉴스", "source_url": "https://www.fnnews.com/news/202608131513057007"}, {"title": "美 CPI 둔화에 달러 약세…9월 금리 인상 베팅 축소", "summary": "7월 미국 소비자물가가 예상에 부합하는 0.1% 상승에 그치면서 9월 연준 인상 가능성이 54%에서 40%로 낮아졌다. 달러는 약세를 보였지만 주간 기준으로는 3주 만에 첫 상승을 기록했다.", "insight": "물가 지표 하나에도 금리 기대가 빠르게 뒤바뀌는 만큼, 환율에 노출된 사업은 단일 이벤트에 베팅하는 헤지 전략을 피해야 한다. 데이터 발표 주기에 맞춰 리스크를 분산하는 것이 더 안전하다.", "source_name": "Yahoo Finance", "source_url": "https://finance.yahoo.com/news/dollar-treads-water-fed-hike-041227590.html"}]}, "summary": "AI 인프라 투자와 반도체 실적은 사상 최고치를 기록했지만 시장 변동성·금리 불확실성은 오히려 커졌고, 마케팅은 크리에이터 파트너십과 에이전틱 커머스 중심으로 빠르게 재편되고 있다."}, "2026.08.15": {"date": "2026.08.15", "it": {"domestic": [{"title": "생성형 AI 개인정보 국외이전, 국내 기업 데이터 거버넌스 과제로 부상", "summary": "ZDNet Korea가 생성형 AI 서비스 이용 시 개인정보가 해외 서버로 이전되는 문제를 다루며, 국내 기업들이 데이터 거버넌스 체계를 재정비해야 한다고 지적했다. AI 도입 속도가 빨라지는 만큼 관련 법적 리스크도 함께 커지고 있다는 진단이다.", "insight": "해외 AI API를 제품에 연동할 때 개인정보 국외이전 동의 절차와 처리방침 고지를 설계 단계에서 반영해야 출시 후 규제 리스크를 피할 수 있다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260813164711"}, {"title": "미 인플레 완화에 삼성전자 2%·SK하이닉스 3%대 상승 마감", "summary": "미국 물가지표 둔화로 금리 인하 기대가 살아나면서 뉴욕 반도체주가 강세를 보였고, 이 여파로 국내 증시에서도 삼성전자와 SK하이닉스가 동반 상승 마감했다.", "insight": "반도체 업황 개선 신호는 하드웨어·AI 인프라 스타트업의 투자 유치 타이밍에도 영향을 주므로, 펀딩 전략을 세우는 PM이라면 반도체 사이클 지표를 주기적으로 체크할 필요가 있다.", "source_name": "파이낸셜뉴스", "source_url": "https://www.fnnews.com/news/202608141539086139"}, {"title": "\"2027년 PER 3배 저평가\"…K-반도체, 1000조 실적 호황 속 재평가 속도", "summary": "SK증권은 삼성전자와 SK하이닉스의 합산 영업이익이 2026년 641조원, 2027년 977조원에 이를 것으로 전망하며 현재 주가가 이익 규모 대비 저평가돼 있다고 분석했다.", "insight": "메모리 업사이클이 예상보다 길어질 경우 클라우드·AI 인프라 원가 구조가 바뀔 수 있어, 원가 기획 시 반도체 공급가 전망치를 반영한 시나리오 플래닝이 필요하다.", "source_name": "이투데이", "source_url": "https://www.etoday.co.kr/news/view/2614759"}], "international": [{"title": "애플, 앱스토어 외부 결제에도 15% 수수료 부과 제안", "summary": "애플이 EU 규제에 대응해 앱 내 외부 링크를 통한 구매에 대해서도 표준 앱 기준 15% 수수료를 부과하는 새 방안을 제출했다. 외부 결제를 허용하되 사실상 수수료 구조는 유지하려는 시도로 해석된다.", "insight": "외부 결제 링크 도입을 검토 중인 프로덕트팀이라면, 15% 수수료가 유지되는 조건에서 실제 마진 구조가 개선되는지부터 재계산해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/14/apple-proposes-to-take-a-15-cut-of-purchases-made-outside-the-app-store/"}, {"title": "OpenAI, GPT-5.6 Sol 14배 빠른 '울트라패스트' 모드 공개", "summary": "OpenAI가 GPT-5.6 Sol 모델을 기존보다 14배 빠르게 처리하는 신규 모드 '울트라패스트'를 출시했다. 추론 속도가 AI 모델 경쟁의 새로운 축으로 떠오르고 있다.", "insight": "응답 지연이 이탈률에 직결되는 실시간 챗봇·에이전트 제품이라면, 속도 최적화 모델 전환에 따른 리텐션 개선 효과를 A/B로 검증해볼 시점이다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/13/openai-introduces-ultrafast-a-new-mode-that-makes-gpt-5-6-sol-work-at-14x-the-speed/"}, {"title": "데이터브릭스, 1900억 달러 밸류에이션으로 50억 달러 투자 유치", "summary": "데이터브릭스가 당초 10억 달러를 목표로 투자 유치에 나섰으나 투자자 수요가 몰리며 최종 50억 달러, 기업가치 1900억 달러로 라운드를 마무리했다.", "insight": "데이터 인프라 기업에 대한 밸류에이션 프리미엄이 여전히 높다는 신호로, 데이터 파이프라인·분석 도구 로드맵 우선순위를 엔터프라이즈 거버넌스 수요 중심으로 재확인할 만하다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/13/databricks-wanted-to-raise-1b-investors-wanted-15b-it-settled-on-5b-at-a-190b-valuation/"}]}, "marketing": {"domestic": [{"title": "\"2026 인플루언서 마케팅, 콘텐츠 파트너에서 커머스 파트너로\"", "summary": "오픈애즈 리포트에 따르면 인플루언서 마케팅 성과 측정 기준이 조회수·좋아요 중심에서 전용 판매 링크, 할인 코드, UTM을 통한 실제 매출 기여로 이동하고 있다. 유튜브, 네이버, 쿠팡도 잇따라 인플루언서 커머스 기능을 출시했다.", "insight": "인플루언서 캠페인 KPI를 도달률에서 매출 기여(전환·재구매)로 재설계하고, 커머스 커넥트형 트래킹 인프라 도입을 이번 분기 우선순위에 올려야 한다.", "source_name": "오픈애즈", "source_url": "https://www.openads.co.kr/content/contentDetail?contsId=19965"}, {"title": "\"2026년 이커머스 마케팅, 이렇게 준비하세요\"(feat. 트렌드 코리아)", "summary": "아이보스 칼럼은 트렌드 코리아 2026을 인용해 크리에이터 믹스, AI 프로듀싱, GEO(생성형 엔진 최적화) 등을 이커머스 마 ght": "지수 급등기에는 광고 CPC·마케팅 예산 집행 심리도 함께 개선되는 경향이 있어, 퍼포먼스 마케터는 이번 분기 입찰 경쟁 심화 가능성을 예산 계획에 반영해야 한다.", "source_name": "국제뉴스", "source_url": "https://www.gukjenews.com/news/articleView.html?idxno=3664570"}, {"title": "상승 출발하는 코스피, 원/달러 환율은 1410원대로 하락", "summary": "이날 코스피는 상승 출발했고, 서울 외환시장에서 원/달러 환율은 1416.5원까지 내리며 원화 강세 흐름을 이어갔다.", "insight": "원화 강세는 해외 SaaS 라이선스 등 외화 지출 원가를 낮추는 요인이므로, 연간 예산을 짜는 PM이라면 환율 변동을 IT·마케팅 툴 구매 타이밍에 연동해 검토할 만하다.", "source_name": "뉴스핌", "source_url": "https://www.newspim.com/news/view/20260814000274"}, {"title": "하이닉스 60조·삼성전자 89조 벌었는데… 주가는 왜 이제야 반응하나", "summary": "삼성전자와 SK하이닉스가 역대급 영업이익을 기록했음에도 그동안 주가 반영이 더뎠던 이유를 다루며, 최근에야 실적 대비 저평가 해소 국면에 들어섰다고 분석했다.", "insight": "실적과 주가의 괴리가 좁혀지는 시점은 대기업 협력사·B2B 벤더의 예산 집행이 늘어나는 신호일 수 있어, 엔터프라이즈 영업 파이프라인 타이밍 조정에 참고할 지표다.", "source_name": "SBS Biz", "source_url": "https://premium.sbs.co.kr/article/jfzAcculv"}], "international": [{"title": "실적 호조·물가 안정에 미 증시 선물 상승", "summary": "기업 실적이 예상을 웃돌고 인플레이션 지표가 완화되면서 미국 증시 선물이 상승했다. S&P500은 사상 최고치를 경신하며 3주 연속 상승세를 이어갔다.", "insight": "미 증시 훈풍은 글로벌 벤처 투자심리에도 우호적으로 작용하므로, 해외 투자 유치를 준비하는 스타트업은 이번 분기 내 라운드 클로징을 서두르는 것이 유리할 수 있다.", "source_name": "Bloomberg", "source_url": "https://www.bloomberg.com/news/articles/2026-08-14/us-stock-futures-up-as-strong-earnings-benign-data-drive-gains"}, {"title": "7월 PPI 예상치 하회… 9월 금리 인상 우려 완화되며 뉴욕증시 상승", "summary": "미 노동부가 발표한 7월 생산자물가지수(PPI)가 시장 예상보다 낮게 나오면서 연준의 9월 금리 인상 가능성이 낮아졌고, 다우·나스닥·S&P500 모두 상승 마감했다.", "insight": "금리 인상 우려 완화는 SaaS 기업 밸류에이션 회복에 직결되므로, 자금 조달을 앞둔 프로덕트 리더는 향후 CPI·PPI 발표 일정을 투자 유치 타임라인에 미리 반영해야 한다.", "source_name": "NBC News", "source_url": "https://www.nbcnews.com/business/markets/stocks-bonds-ppi-inflation-rcna592331"}, {"title": "엔화 급등, 한때 달러당 157엔대…일본 정부 환율 개입 관측", "summary": "뉴욕 외환시장에서 엔화가 급등해 한때 달러당 157엔대까지 상승했다. 일본 정부와 일본은행이 엔화 매수·달러 매도 방식의 시장 개입에 나섰을 가능성이 제기됐고, 미 통화당국도 '레이트 체크'를 실시하는 이례적 공조가 관측됐다.", "insight": "엔화 변동성 확대는 일본向 역직구·크로스보더 커머스 마진에 즉각 영향을 주므로, 일본 시장을 운영 중인 이커머스 PM은 환헤지 또는 동적 가격 정책 도입 여부를 재점검해야 한다.", "source_name": "Investing.com", "source_url": "https://kr.investing.com/news/stock-market-news/article-2038726"}]}, "summary": "미국 물가지표 안정과 반도체 실적 기대가 한미 증시를 동반 끌어올리는 가운데, IT는 추론 속도·가격 경쟁으로, 마케팅은 '조회수'에서 '매출 기여' 중심의 커머스 전환으로 무게중심이 옮겨가는 하루였다."}, "2026.08.16": {"date": "2026.08.16", "it": {"domestic": [{"title": "최태원 SK그룹 회장, GTC 2026 참석해 AI 생태계 파트너십 강화", "summary": "최태원 SK그룹 회장이 미국 새너제이에서 열린 글로벌 기술 콘퍼런스 'GTC 2026'을 찾아 엔비디아 등 글로벌 기업과의 AI 생태계 협력을 논의했다. 젠슨 황, 빌 게이츠, 샘 올트먼 등 글로벌 빅테크 리더들의 방한도 최근 이어지고 있다.", "insight": "국내 대기업의 AI 밸류체인 포지셔닝 경쟁이 심화되는 신호로, PM은 이런 파트너십 발표가 자사 서비스의 인프라·모델 공급망에 미칠 영향을 점검해야 한다.", "source_name": "이데일리", "source_url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01102086645547976"}, {"title": "AI 기업들, 사내 메신저 대화까지 데이터로 사들인다", "summary": "오픈AI·앤트로픽 등 AI 개발사들이 공개 웹 데이터 고갈에 직면하자 데이터 중개 스타트업을 통해 실제 기업의 사내 메신저·협업 데이터를 학습에 활용하는 거래를 늘리고 있다. 데이터 중개 스타트업 프로티지의 거래액은 1년 새 3천만달러에서 1억달러 이상으로 급증했다.", "insight": "사내 커뮤니케이션 데이터의 상업적 가치가 커지는 만큼, 자사 서비스의 데이터 거버넌스·이용약관을 재점검할 필요가 있다.", "source_name": "코리아타임스", "source_url": "http://www.koreatimes.com/article/20260814/1625697"}, {"title": "VC's Pick, 차세대 AI 데이터센터·ESS 배터리에 투자 쏠림", "summary": "이번 주 AI 데이터 인프라, 진단, 보안 등 다양한 분야 스타트업이 벤처캐피털과 액셀러레이터로부터 투자를 유치했으며, 특히 AI 데이터센터 전력 수요에 대응하는 ESS(에너지저장장치) 배터리 관련 스타트업에 시선이 쏠리고 있다.", "insight": "AI 인프라 투자가 컴퓨팅을 넘어 전력·에너지 영역으로 확장되는 추세로, B2B 제품 로드맵에서 에너지 효율을 차별화 포인트로 고려할 만하다.", "source_name": "이데일리", "source_url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01095526645547976"}], "international": [{"title": "메타, 온디바이스 구동 가능한 오픈웨이트 AI 'Muse Glimmer' 공개", "summary": "메타가 300억 파라미터 규모의 오픈웨이트 모델 'Muse Glimmer'를 아파치 2.0 라이선스로 공개했다. 자사 최상위 폐쇄형 모델 'Muse Spark'를 증류해 만든 이 모델은 소비자용 GPU 한 대로도 구동 가능하며 오프라인 에이전트 작업에 최적화됐다.", "insight": "오픈웨이트와 폐쇄형 모델을 이원화하는 메타의 전략은 자체 AI 기능을 구축하려는 서비스에 저비용 온디바이스 옵션을 제공하므로, 인프라 비용 절감 관점에서 벤치마킹할 가치가 있다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/10/metas-new-glimmer-ai-model-offers-a-hint-at-zuckerbergs-personal-intelligence-vision/"}, {"title": "클라우드플레어, AI 에이전트 전용 브라우저 'Kitesurf' 출시", "summary": "클라우드플레어가 사람이 아닌 AI 에이전트를 위해 설계된 클라우드 호스팅 브라우저 'Kitesurf'를 12주 만에 개발해 공개했다. 크로미움 대비 CPU·메모리 소비가 적어 스크린샷 추출, HTML 파싱 등 에이전트 작업에 효율적이다.", "insight": "에이전틱 워크플로우 전용 인프라 시장이 본격 형성되고 있어, 자사 제품에 브라우저 자동화 기능을 넣을 계획이라면 비용 구조를 재검토할 시점이다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/07/cloudflare-launches-kitesurf-a-browser-built-for-ai-agents/"}, {"title": "앤트로픽, 첫 최고글로벌정책책임자로 티노 쿠에야르 선임", "summary": "앤트로픽이 전 캘리포니아 대법관이자 카네기국제평화재단 前 총재인 티노 쿠에야르를 최초의 Chief Global Affairs Officer로 임명했다. 같은 날 백악관은 앤트로픽, 오픈AI, 구글, 메타와 비공개 AI 규제 프레임워크를 논의했다.", "insight": "빅테크의 정책 대응 조직이 격상되는 흐름은 향후 AI 규제 강도가 높아질 신호로, 국내 서비스도 컴플라이언스·정책 대응 체계를 선제적으로 점검해야 한다.", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/news/tino-cuellar"}]}, "marketing": {"domestic": [{"title": "2026년 국내 광고시장 17.9조원 전망…디지털 쏠림 가속", "summary": "코바코(한국방송광고진흥공사)는 2026년 국내 광고시장이 17조9400억원 규모로 성장할 것으로 전망했다. 온라인 광고가 전체의 약 60%를 차지하는 반면 방송광고는 전년 대비 약 13% 감소하는 등 매체 간 양극화가 심화되고 있다.", "insight": "예산 배분 우선순위를 성과 측정이 쉬운 디지털·리테일 미디어 중심으로 재편하고, AI 기본법 시행에 따른 데이터 활용·알고리즘 투명성 요건도 함께 준비해야 한다.", "source_name": "코바코(KOBACO)", "source_url": "https://www.kobaco.co.kr/site/main/board/news/24646"}, {"title": "NHN애드 '오픈애즈', AI 기반 실무 생산성 플랫폼으로 개편", "summary": "NHN애드가 마케팅 콘텐츠 큐레이션 서비스 '오픈애즈'를 AI 기반 실무 생산성 플랫폼으로 전면 개편했다. 직무별 프롬프트 큐레이션과 AI툴 정보를 모은 메뉴를 신설해 마케터·기획자의 업무 효율을 높이는 데 초점을 맞췄다.", "insight": "마케팅 툴 시장에서도 'AI 프롬프트 큐레이션'이 핵심 차별화 요소로 부상하고 있어, 사내 마케팅 도구에도 프롬프트 라이브러리화를 검토할 만하다.", "source_name": "네이트뉴스", "source_url": "https://news.nate.com/view/20250819n29288"}, {"title": "인크로스, '디지털마케팅 트렌드 2026' 보고서 발간", "summary": "인크로스가 2026년 디지털마케팅 트렌드를 담은 보고서를 발간했다. 리테일 미디어, 숏폼, AI 기반 타겟팅 등이 핵심 키워드로 제시됐다.", "insight": "트렌드 보고서에서 반복 언급되는 리테일 미디어 광고는 이커머스 연계 서비스를 가진 조직에 새로운 수익원이 될 수 있어 우선 검토 대상이다.", "source_name": "인크로스", "source_url": "https://www.incross.com/ko/insight/report.asp?mode=view&idx=10647"}], "international": [{"title": "디즈니-틱톡, 크리에이터 IP 라이선싱 파트너십 체결", "summary": "디즈니와 틱톡이 크리에이터들에게 마블·픽사·스타워즈·FX 등의 캐릭터와 장면을 활용해 숏폼 영상을 제작할 수 있도록 허용하는 사상 최초의 콘텐츠 공유 계약을 발표했다. 해당 영상은 틱톡과 디즈니+의 신규 숏폼 피드 'Verts'에 동시 노출된다.", "insight": "대형 IP 보유사가 크리에이터 이코노미에 라이선스를 개방한 첫 사례로, 브랜드 IP를 보유한 조직이라면 유사한 UGC 라이선싱 모델의 수익화 가능성을 검토할 시점이다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/disney-looks-to-tiktok-creators-to-bring-fan-content-to-its-short-form-video-feed/"}, {"title": "인플루언서 마케팅, 크리에이터 피로도 확산이 최대 리스크로", "summary": "미국인의 55%가 5년 전보다 SNS 게시물을 줄였고, 51%는 SNS 활동 유지가 '일처럼 느껴진다'고 답했다. 크리에이터 공급이 줄어드는 반면 브랜드의 콘텐츠 수요는 늘면서 진정성 있는 크리에이터 확보 경쟁이 치열해지고 있다.", "insight": "크리에이터 섭외 난이도가 오르는 만큼, 소수 정예 크리에이터와의 장기 파트너십 모델로 전환하는 전략이 단발성 캠페인보다 ROI 방어에 유리하다.", "source_name": "Newengen", "source_url": "https://newengen.com/insights/influencer-marketing-trends-august-2026/"}, {"title": "AI 검색 확산에 따라 '컨텍스추얼 광고' 재부상", "summary": "챗GPT·퍼플렉시티·제미나이 등 AI 어시스턴트 이용이 늘면서 콘텐츠 맥락에 맞춰 광고를 배치하는 컨텍스추얼 타겟팅이 다시 주목받고 있다. 쿠키 기반 타겟팅의 대안으로 브랜드 안전성과 관련성을 동시에 확보하려는 시도다.", "insight": "서드파티 쿠키 규제 강화와 맞물려 컨텍스추얼 광고 상품을 자사 미디어 믹스에 조기 편입하면 향후 타겟팅 리스크를 분산할 수 있다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/marketing-trends-outlook-2026/810740/"}]}, "economy": {"domestic": [{"title": "코스피 6800선 돌파…사상 최고치 경신 랠리", "summary": "코스피 지수가 전일 대비 3.56% 오른 6813.34에 마감하며 사상 최고치 랠리를 이어갔다. 반도체 수출 호조와 외국인 매수세가 지수 상승을 견인했다.", "insight": "단기간 급등에 따른 밸류에이션 부담이 커진 만큼, 투자 관련 서비스라면 변동성 확대 국면에 대비한 리스크 안내 콘텐츠를 준비해야 한다.", "source_name": "뉴스핌", "source_url": "https://www.newspim.com/news/view/20260813001115"}, {"title": "한국은행, 기준금리 2.50% 동결…올해 성장률 전망 2.6%로 상향", "summary": "한국은행이 기준금리를 연 2.50%로 동결하며 올해 경제성장률 전망치를 2.6%로 대폭 상향 조정했다. 반도체 수출 호조와 내수 개선세가 성장률 상향의 배경으로 꼽힌다.", "insight": "금리 동결 기조가 이어지는 만큼 소비 심리 개선을 전제로 한 프리미엄·구독형 서비스의 가격 전략을 다시 테스트해볼 시점이다.", "source_name": "MBC뉴스", "source_url": "https://imnews.imbc.com/news/2026/econo/article/6825814_36932.html"}, {"title": "정부, MSCI 선진국지수 편입 로드맵 39개 과제 중 30개 완료", "summary": "재정경제부는 외환건전성협의회 겸 MSCI 선진국지수 편입추진 TF를 열고 8대 분야 39개 과제 중 30건(77%)을 완료했다고 밝혔다. 해외에서 원화를 보유·결제할 수 있는 한은 원화국제결제망은 내년 가동을 목표로 한다.", "insight": "MSCI 선진국 편입이 가시화되면 외국인 자금 유입 확대가 예상되므로, 핀테크·자산관리 서비스는 해외 투자자 대상 상품 설계를 미리 준비할 필요가 있다.", "source_name": "뉴스핌", "source_url": "https://www.newspim.com/news/view/20260814000969"}], "international": [{"title": "미국 7월 CPI 3.4%…9월 금리 동결 가능성 64%로 상승", "summary": "미국 7월 소비자물가지수(CPI)가 전년 대비 3.4% 상승해 시장 예상치에 부합했다. CME 페드워치에 따르면 9월 연준이 기준금리(3.50~3.75%)를 동결할 확률이 전일 52%에서 64%로 상승했다.", "insight": "금리 동결 기대가 굳어지는 국면에서는 달러 강세 완화 가능성을 전제로 해외 진출·환헤지 전략을 재점검하는 것이 유효하다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/08/12/cpi-inflation-report-july-2026.html"}, {"title": "인플레 둔화에도 연준 9월 정책 두고 내부 이견 여전", "summary": "7월 CPI가 시장 예상에 부합했음에도 연준 내부에서는 9월 금리 정책을 두고 견해가 엇갈리고 있다. 노동시장 냉각 신호와 끈적한 기대인플레이션(1년 기대치 4.1%)이 동시에 나타나며 판단을 어렵게 만들고 있다.", "insight": "연준의 정책 불확실성이 지속되는 한 글로벌 자금 조달 비용 예측이 어려우므로, 투자 유치나 대규모 마케팅 예산 집행 시점은 보수적으로 잡는 것이 안전하다.", "source_name": "Kiplinger", "source_url": "https://www.kiplinger.com/investing/economy/cpi-report-july-2026-what-to-expect"}, {"title": "브라질 중앙은행, 셀릭금리 14.0%로 4연속 인하", "summary": "브라질 중앙은행이 기준금리(셀릭)를 14.0%로 낮추며 4회 연속 금리 인하를 단행했다. 주요국 중 여전히 높은 실질금리 수준을 유지하면서도 완화 기조를 이어가고 있다.", "insight": "신흥국 중심의 통화완화 사이클이 이어지고 있어, 신흥시장 진출을 계획 중이라면 현지 소비 여력 개선 시점과 진입 타이밍을 맞춰볼 만하다.", "source_name": "Rio Times Online", "source_url": "https://www.riotimesonline.com/global-economy-briefing-august-15-2026/"}]}, "summary": "AI 생태계는 정책 대응 체계를 갖추는 동시에 오픈소스 모델 경쟁으로 확산되고, 광고 예산은 디지털·리테일 미디어로 빠르게 이동하며, 금융시장은 인플레이션 둔화 속 금리 동결 기대가 굳어지는 하루였다."}, "2026.08.18": {"date": "2026.08.18", "it": {"domestic": [{"title": "리벨리온, IPO 주관사 한투에서 KB증권으로 전격 교체", "summary": "AI 반도체 스타트업 리벨리온이 기업공개(IPO)를 앞두고 공동 주관사를 한국투자증권에서 초기 투자사인 KB증권으로 교체했다. 상장 완주를 위한 파트너 재정비로 풀이된다.", "insight": "국내 AI반도체 대장주 후보의 주관사 교체는 IPO 밸류에이션 협상력과 직결되는 이슈로, 상장 타임라인과 투자 유치 전략이 언제든 재조정될 수 있음을 보여준다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260814173139"}, {"title": "KT-서울대병원, 의료 AX(AI전환) 플랫폼 구축 업무협약", "summary": "KT가 서울대병원과 진료·간호·연구·병원 운영 전반에 AI를 적용하는 의료 AX 플랫폼 구축 업무협약을 체결했다.", "insight": "통신사가 특정 버티컬(의료)의 AI 전환을 통째로 수주하는 방식은, B2B 서비스에서 '플랫폼+도메인 파트너십' 조합이 경쟁 우위가 될 수 있음을 시사한다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260817080933"}, {"title": "이통3사, 5G·LTE 통합요금제에 OTT·AI 구독 결합", "summary": "SK텔레콤·KT·LG유플러스가 영상 소비와 AI 활용 증가 추세에 맞춰 중고가 통합요금제에 OTT·AI 구독 서비스를 묶어 제공하기 시작했다.", "insight": "통신 요금제에 AI 구독을 번들링하는 전략은 자체 유료 전환율이 낮은 AI 서비스에 새로운 배포 채널이 될 수 있어, 통신사 제휴형 번들링을 대안으로 검토할 시점이다.", "source_name": "ZDNet Korea", "source_url": "https://zdnet.co.kr/view/?no=20260814222156"}], "international": [{"title": "Groq, AI 칩에서 '뉴클라우드'로 피벗하며 3.5억달러 유치", "summary": "AI 반도체 스타트업 Groq가 칩 설계 중심 사업에서 클라우드 추론 서비스(뉴클라우드)로 전환하며 3억5000만달러를 추가 조달했다.", "insight": "하드웨어 스타트업이 마진이 더 큰 인프라 서비스로 이동하는 흐름은 AI 인프라 시장에서 '칩→클라우드' 수직계열화가 표준 전략이 되고 있음을 보여준다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/17/groq-raises-350m-to-fuel-its-pivot-from-ai-chips-to-neocloud/"}, {"title": "엔비디아, 오픈AI 프로젝트 배후 소프트뱅크 데이터센터 개발사에 15억달러 투자 검토", "summary": "엔비디아가 오픈AI 관련 데이터센터 프로젝트를 진행 중인 소프트뱅크 자회사에 15억달러 투자를 검토하고 있다.", "insight": "엔비디아가 GPU 판매를 넘어 데이터센터 지분까지 확보하는 것은 공급망 전체를 락인하려는 전략으로, AI 인프라 의존도가 높은 서비스는 공급 집중 리스크를 사업계획에 반영해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/17/nvidia-investing-1-5b-in-softbank-data-center-developer-behind-openai-project/"}, {"title": "스트라이프, AI 게이트웨이 스타트업 OpenRouter 70억달러 이상에 인수 추진", "summary": "결제기업 스트라이프가 여러 AI 모델을 하나의 API로 라우팅해주는 OpenRouter를 70억달러 이상에 인수할 것으로 알려졌다.", "insight": "결제사가 AI 모델 라우팅 계층을 인수하는 것은 '결제+AI 인프라' 결합이 차세대 플랫폼 경쟁의 핵심이 될 수 있음을 시사하며, 멀티모델 전략을 쓰는 서비스는 벤더 종속 리스크를 재점검해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/16/stripe-will-reportedly-acquire-ai-gateway-startup-openrouter-for-7b/"}]}, "marketing": {"domestic": [{"title": "모비데이즈 'MAX SUMMIT 2026' 개최…AI가 바꾸는 마케팅의 미래", "summary": "모비데이즈가 서울 코엑스에서 'MAX SUMMIT 2026'을 열고 'The AI Era'를 주제로 브랜드·플랫폼·솔루션 기업이 연결되는 AI 마케팅 비즈니스 플랫폼으로 행사를 확장했다.", "insight": "업계 대표 컨퍼런스가 세미나에서 '비즈니스 매칭 플랫폼'으로 성격을 바꾼 것은, AI 마케팅 툴 도입이 실험 단계를 지나 실제 구매·파트너십 단계로 넘어갔다는 신호다.", "source_name": "MADTimes", "source_url": "https://www.madtimes.co.kr/news/articleView.html?idxno=28181"}, {"title": "하인즈 케첩, 월드컵 레드카드 소재로 저관여 상품 브랜딩 성공", "summary": "크래프트하인즈가 월드컵 레드카드를 활용한 '케첩이 부족한 건 반칙이다' 캠페인으로 저관여 상품인 케첩의 브랜드 존재감을 끌어올렸다.", "insight": "저관여 카테고리일수록 대형 이벤트의 상징을 재해석하는 것이 광고 회상률을 높이는 효율적 전략이 될 수 있다.", "source_name": "DMC리포트", "source_url": "https://www.dmcreport.co.kr/contentview?dr_code=DMCRPF2026366560"}, {"title": "2026 신용카드 브랜드지수 리포트…PLCC·간편결제 경쟁 심화", "summary": "DMC미디어가 발표한 신용카드 브랜드지수 리포트에 따르면 상위 카드사 경쟁이 PLCC(상업자표시카드)와 간편결제 로열티 중심으로 재편되고 있다.", "insight": "금융 브랜드 마케팅의 핵심 지표가 '카드 자체 브랜드'에서 '결제 로열티 생태계'로 이동하고 있어, 리텐션 지표를 결제 빈도·제휴처 다양성 중심으로 재설계할 필요가 있다.", "source_name": "DMC리포트", "source_url": "https://www.dmcreport.co.kr/contentview?dr_code=DMCRPP2026366561"}], "international": [{"title": "아마존·나이키, Gen Alpha 세대 브랜드 선호도 1위", "summary": "최신 리포트에 따르면 10대 초반 Gen Alpha 세대에서 아마존과 나이키가 가장 선호되는 브랜드로 꼽혔다.", "insight": "차세대 소비층의 브랜드 로열티가 이미 형성되고 있다는 점에서, 장기 브랜드 전략은 지금의 10대를 대상으로 한 커뮤니티·크리에이터 접점 투자를 앞당겨야 한다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/amazon-nike-reign-supreme-with-gen-alpha-teens-report/827946/"}, {"title": "닐슨, 21.5억달러에 더블베리파이 인수…광고 검증·시청측정 통합", "summary": "닐슨이 21억5000만달러에 DoubleVerify를 인수해 광고 검증과 시청률 측정을 하나의 플랫폼으로 통합한다.", "insight": "독립성이 강점이던 애드버리피케이션 업체들이 대형 측정사에 흡수되면서, 광고주는 향후 '독립 검증' 데이터의 신뢰성 저하 가능성을 계약 조건에 반영해야 한다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/nielsen-acquires-doubleverify-to-link-ad-verification-audience-measurement/827319/"}, {"title": "스마트폰 등교 금지 확산 시 소셜미디어 광고 매출 수십억달러 타격 우려", "summary": "미국 내 학교 스마트폰 금지 정책이 확산될 경우 소셜미디어 광고 매출에 수십억달러 규모의 타격이 예상된다는 분석이 나왔다.", "insight": "10대 이용시간에 의존하는 소셜 플랫폼의 광고 매출 구조는 규제 리스크에 취약하므로, 해당 채널 의존도가 높은 브랜드는 미디어믹스 다각화를 선제적으로 검토해야 한다.", "source_name": "Marketing Dive", "source_url": "https://www.marketingdive.com/news/smartphone-school-ban-could-imperil-billions-in-social-media-ad-revenue/827739/"}]}, "economy": {"domestic": [{"title": "김정관 산업부 장관, 대미투자 속도 요구에 막판 쟁점 해결 위해 방미", "summary": "김정관 산업통상부 장관이 미국의 대미투자 속도 요구에 대응해 워싱턴을 방문, 1호 투자 발표 지연에 따른 미국 측 불만 해소에 나섰다.", "insight": "대미 투자 협상 지연은 관련 기업들의 미국 진출 일정과 환율 변동성에 직접 영향을 주므로, 미국 매출 비중이 큰 사업은 협상 지연 리스크를 예산 계획에 반영해야 한다.", "source_name": "한국경제", "source_url": "https://www.hankyung.com/article/202608174414i"}, {"title": "자동차 개소세 인하 종료로 내년 신차 가격 100만원 인상 전망", "summary": "개별소비세 인하 혜택이 종료되면서 내년부터 신차 가격이 대당 약 100만원 오를 것으로 전망된다.", "insight": "세제 혜택 종료 전 '막차 수요'가 하반기 집중될 가능성이 높아, 자동차·모빌리티 관련 서비스는 연말 프로모션과 재고 전략을 미리 조정해야 한다.", "source_name": "한국경제", "source_url": "https://www.hankyung.com/article/202608163815i"}, {"title": "개미 6조원 순매도에도 외국인은 '삼성전자·SK하이닉스' 순매수", "summary": "개인 투자자들이 6조원어치를 순매도하는 동안 외국인 투자자는 삼성전자와 SK하이닉스 등 반도체 대형주를 집중 매수했다.", "insight": "개인과 외국인의 수급 방향이 엇갈리는 국면은 반도체 업종의 단기 변동성을 키우므로, 관련 산업 종사자는 주가 변동이 채용·투자 심리에 미치는 영향을 모니터링할 필요가 있다.", "source_name": "한국경제", "source_url": "https://www.hankyung.com/article/2026081639177"}], "international": [{"title": "달러, 연준 긴축 기대 후퇴로 3개월래 최저치로 하락", "summary": "미국 경제지표 둔화로 시장이 연준의 추가 긴축 기대를 낮추면서 달러지수가 3거래일 연속 하락, 5월 중순 이후 최저 수준을 기록했다.", "insight": "달러 약세 전환은 원자재·신흥국 통화에 우호적으로 작용하므로, 해외 매출 비중이 큰 국내 기업은 환헤지 전략을 재점검할 시점이다.", "source_name": "Bloomberg", "source_url": "https://www.bloomberg.com/news/articles/2026-08-17/dollar-extends-slide-as-traders-scale-back-fed-tightening-bets"}, {"title": "유로존 7월 소비자물가 2.9%로 반등…ECB 추가 인상 압박", "summary": "유로존 7월 소비자물가상승률이 전월 2.8%에서 2.9%로 반등했다. 에너지 가격이 10.0%로 가장 크게 올랐고, ECB는 6월 금리 인상에 이어 추가 인상 압박에 직면했다.", "insight": "유럽발 인플레이션 재점화는 유럽向 수출입 기업의 환율·금리 비용에 영향을 줄 수 있어, 유럽 사업 비중이 있는 조직은 3분기 원가 시나리오를 다시 짜야 한다.", "source_name": "Eurostat", "source_url": "https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Inflation_in_the_euro_area"}, {"title": "IEA 8월 오일마켓 리포트…호르무즈해협 여파로 원유 공급 차질 지속", "summary": "국제에너지기구(IEA)의 8월 보고서에 따르면 호르무즈해협 관련 공급 차질로 걸프 산유량 830만b/d가 여전히 막혀 있으며, 2026년 세계 석유 수요는 감소세를 이어갈 전망이다.", "insight": "중동발 공급 불안이 장기화되는 국면에서는 물류·에너지 비용 변동성이 커지므로, 원가에서 에너지 비중이 높은 사업은 헤지 및 대체 공급망 확보를 우선순위에 둬야 한다.", "source_name": "IEA", "source_url": "https://www.iea.org/reports/oil-market-report-august-2026"}]}, "summary": "AI 인프라를 둘러싼 빅테크의 자본 재편(엔비디아·스트라이프·닐슨의 대형 투자·인수)과 중동발 공급 불안에 따른 환율·에너지 리스크가 동시에 부각되며, 국내에서는 정부의 대미 투자 협상과 통신·마케팅 업계의 AI 번들링 전략이 이에 대응하는 흐름을 보였다."}, "2026.08.19": {"date": "2026.08.19", "it": {"domestic": [{"title": "삼성SDS, 국가 AI 연구용 GPU 컴퓨팅 서비스 개시", "summary": "삼성SDS가 과기정통부·IITP가 발주한 '2026년 AI 연구용 컴퓨팅 지원' 사업의 GPU 공급사로 선정돼 엔비디아 H100과 최신 B300(블랙웰 울트라)을 학계·연구기관에 공급하기 시작했다. 사업 규모는 약 153억원이며 내년 3월까지 대학과 정부출연연구기관의 초거대 AI·LLM 연구를 지원한다.", "insight": "자체 GPU 확보가 어려운 국내 연구기관에 정부 주도 컴퓨팅 인프라가 공급되는 구조로, 산학 공동 LLM 연구·오픈소스 모델 생태계가 향후 국내 AI 서비스 기획의 레퍼런스 소스로 늘어날 수 있다.", "source_name": "전자신문", "source_url": "https://www.etnews.com/20260811000033"}, {"title": "AI·방산·로봇기업들 잇달아 출격…8월 IPO 시장 달군다", "summary": "8월 국내 IPO 시장에 AI, 방산, 로봇 관련 기업들의 상장이 몰리고 있다. 투자심리가 성장성 높은 딥테크·로봇 섹터로 쏠리면서 공모주 시장의 관심이 집중되는 모습이다.", "insight": "로봇·피지컬 AI 기업의 잇단 상장은 해당 섹터 밸류에이션이 시장에서 검증받는 계기가 되며, B2B 로봇 SaaS·플랫폼 기획 시 투자자 설득 논리(비교기업, 멀티플)로 활용할 수 있다.", "source_name": "아주경제", "source_url": "https://www.ajunews.com/view/20260802134005221"}, {"title": "젠슨 황 만찬에 韓 로봇 스타트업…엔비디아 투자 접점 확대", "summary": "엔비디아 젠슨 황 CEO가 주최한 만찬에 국내 로봇 스타트업들이 참석하며 엔비디아와의 투자·협력 접점이 넓어지고 있다는 소식이 전해졌다. 피지컬 AI 분야에서 글로벌 빅테크와 국내 스타트업 간 네트워크가 강화되는 흐름이다.", "insight": "엔비디아의 로봇 파운데이션 모델·시뮬레이션 스택(Isaac 등)에 대한 국내 접근성이 높아질 가능성이 있어, 로봇/피지컬 AI 로드맵을 짜는 PM은 엔비디아 생태계 연동 여부를 조기에 점검할 필요가 있다.", "source_name": "이데일리", "source_url": "https://www.edaily.co.kr/News/Read?newsId=02496086645477784&mediaCodeNo=257"}], "international": [{"title": "Stripe, AI 게이트웨이 스타트업 OpenRouter 7조원대에 인수", "summary": "스트라이프가 400여 개 AI 모델을 라우팅해주는 OpenRouter를 7억 달러가 아닌 70억 달러(약 7조원) 이상에 인수하는 계약을 최종 확정했다. 이는 지난 5월 시리즈B 밸류에이션(13억 달러) 대비 5.4배에 달하는 프리미엄이다.", "insight": "결제 인프라 기업이 AI 모델 라우팅·과금 계층까지 수직 통합하려는 신호로, 멀티모델 오케스트레이션 기능을 자체 제품에 내재화할지 외부 API에 의존할지에 대한 빌드-vs-바이 판단을 다시 검토해야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/16/stripe-will-reportedly-acquire-ai-gateway-startup-openrouter-for-7b/"}, {"title": "AI 추론칩 스타트업 Etched, 한 달 만에 기업가치 2배 21조원", "summary": "AI 추론 특화 ASIC을 개발하는 Etched가 제인 스트리트 등으로부터 7억 달러를 추가 유치하며 기업가치가 210억 달러로 뛰었다. 지난달 103억 달러였던 밸류에이션이 한 달 만에 두 배로 오른 것이다.", "insight": "추론 전용 커스텀 실리콘에 대한 실사용 고객(제인 스트리트) 검증이 밸류에이션 급등의 근거가 됐다는 점에서, AI 인프라 스타트업 투자 유치 스토리를 짤 때 '실제 워크로드 채택 사례'가 가장 강력한 신뢰 신호임을 보여준다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/18/etcheds-valuation-doubles-to-21b-in-a-month/"}, {"title": "애플, 카메라 탑재 에어팟 macOS 코드에서 포착", "summary": "macOS 26.7 릴리스 후보 버전에서 카메라가 내장된 에어팟(코드네임 B790)의 데모 영상이 발견됐다. 온이어 카메라가 Visual Intelligence와 연동돼 착용자 주변 사물을 인식하고 시리가 관련 정보를 안내하는 방식이다.", "insight": "이어폰이 '보는 디바이스'로 확장되면서 오디오 중심이던 웨어러블 UX에 시각 컨텍스트 기반 어시스턴트 시나리오가 추가된다. 커머스·리테일 PM이라면 '보이는 것을 바로 사는' 비주얼 커머스 훅을 이 폼팩터에 미리 대비할 필요가 있다.", "source_name": "MacRumors", "source_url": "https://www.macrumors.com/2026/08/17/camera-equipped-airpods-macos-26-7/"}]}, "marketing": {"domestic": [{"title": "공정위, AI 가상인물 광고 '가상인물' 표시 의무화", "summary": "공정거래위원회가 생성형 AI·딥페이크로 만든 가상인물이 추천·보증 광고에 등장할 경우 '가상인물' 표시를 의무화하는 심사지침 개정안을 시행한다. 블로그 등 텍스트 매체는 제목·본문 상단에, 영상·이미지는 화면에 지속적으로 표시해야 한다.", "insight": "AI 인플루언서·가상 모델을 활용한 캠페인을 준비 중이라면 표시 문구 삽입을 크리에이티브 제작 단계부터 체크리스트화해야 하며, 미표시 시 표시광고법 위반 리스크를 마케팅팀뿐 아니라 법무 검토 프로세스에 명시적으로 포함해야 한다.", "source_name": "디지털타임스", "source_url": "https://www.dt.co.kr/article/12065092"}, {"title": "오픈애즈, '미디어&마켓 리포트' 7월호 발간", "summary": "오픈애즈가 발간한 미디어&마켓 리포트 7월호에서 F&B 업계의 올드but뉴 상품 마케팅 활성화, 메타 AI 글래스 국내 정식 출시 등 최근 미디어·마케팅 이슈를 정리했다.", "insight": "메타 AI 글래스의 국내 정식 출시는 새로운 광고 인벤토리(시야 기반 컨텍스추얼 광고)의 등장을 의미하므로, 옥외·리테일 마케팅 담당자는 웨어러블 광고 규격과 개인정보 처리 기준을 선제적으로 검토해야 한다.", "source_name": "오픈애즈", "source_url": "https://www.openads.co.kr/content/contentDetail?contsId=19834"}, {"title": "2026 대한민국 광고시장, 디지털 쏠림 이후의 생활 접점 경쟁", "summary": "2026년 국내 광고시장은 17조 9,400억원 규모로 전망되며, 온라인·디지털·리테일 미디어는 성장을 지속하는 반면 방송·인쇄는 조정 국면이 이어질 것으로 분석됐다. 광고 경쟁의 무대가 모바일 피드에서 DOOH, 팝업, 유통 매장 등 생활 접점으로 확산되고 있다.", "insight": "매체 예산 배분 전략을 짤 때 디지털 vs 오프라인의 이분법 대신, '생활 동선 어디서 접점을 만들 것인가'라는 접점 설계 관점으로 미디어믹스를 재구성할 시점이다.", "source_name": "K-트렌디뉴스", "source_url": "https://www.k-trendynews.com/news/articleView.html?idxno=202817"}], "international": [{"title": "디즈니-틱톡, 세계 최초 숏폼 콘텐츠 공유 파트너십 체결", "summary": "디즈니와 틱톡이 픽사·마블·스타워즈·FX 등 디즈니 IP 장면을 활용해 크리에이터가 영상을 제작할 수 있는 글로벌 파트너십을 발표했다. 참여 크리에이터의 영상은 틱톡과 디즈니+ 신규 세로형 피드 'Verts'에 동시 노출되며 미국을 시작으로 순차 확대된다.", "insight": "라이선스 IP를 창작 재료로 개방해 UGC 파이프라인을 늘리는 전략은 팬덤 기반 콘텐츠 마케팅의 새 표준이 될 수 있어, 자체 IP 보유 브랜드는 '통제된 개방'(가이드라인+리워드) 구조를 벤치마킹할 만하다.", "source_name": "TikTok Newsroom", "source_url": "https://newsroom.tiktok.com/the-walt-disney-company-and-tiktok-announce-a-first-of-its-kind-global-short-form-content-sharing-deal?lang=en"}, {"title": "Optimizely 조사: 소비자 75% \"받는 마케팅이 나와 무관하다\"", "summary": "옵티마이즐리 리서치에 따르면 소비자의 75%가 자신이 받는 마케팅 메시지가 무관하다고 응답했다. AI 도입에 따른 효율 기대와 실제 개인화 체감 사이의 간극이 여전히 크다는 점을 보여준다.", "insight": "AI 퍼스널라이제이션 도구 도입 자체가 목적이 되어서는 안 되며, '고객이 체감하는 관련성'을 KPI로 명시하지 않으면 AI 투자가 실질 성과로 이어지지 않는다는 경고로 읽어야 한다.", "source_name": "Optimizely", "source_url": "https://www.optimizely.com/company/press/2026-global-data-study"}, {"title": "Braze 2026 고객 인게이지먼트 리뷰: AI 쇼핑 에이전트 사용 46%까지 급증 전망", "summary": "Braze 리서치에 따르면 소비자의 AI 쇼핑 에이전트 이용률이 올해 말까지 19%에서 46%로 늘어날 것으로 전망됐다. 반면 마케팅 리더의 71%는 AI 에이전트가 고객과의 직접 접점을 약화시켰다고 답했다.", "insight": "AI 에이전트가 구매 결정의 중간 대리인이 되는 흐름에서는 브랜드가 소비자에게 직접 메시지를 전달하기보다 '에이전트가 신뢰하는 데이터'(정확한 제품 피드, 가격, 속성)를 최적화하는 GEO/AEO형 마케팅 역량이 새로운 필수 스킬이 된다.", "source_name": "Braze", "source_url": "https://www.braze.com/press-releases/the-2026-braze-customer-engagement-review-ai-innovation-meets-the-trust-plateau"}]}, "economy": {"domestic": [{"title": "코스피, 美 장기금리 부담에 7200선 찍고 6800선대로 급락 마감", "summary": "코스피가 장중 7,216선까지 오른 뒤 미국 30년물 국채금리 19년래 최고치 부담과 차익실현 매물에 밀려 전일 대비 1.55% 하락한 6,869.83으로 마감했다. 코스닥도 3.52% 내린 834.20으로 장을 마쳤고, 원/달러 환율은 10개월 만에 최저 수준을 기록했다.", "insight": "5거래일 연속 상승 후 나온 되돌림이라는 점에서 단기 트렌드 전환으로 단정하기는 이르며, 반도체 업종 심리 자체는 여전히 견조하다는 신호와 매크로발 변동성을 분리해서 봐야 한다.", "source_name": "Businesskorea", "source_url": "https://www.businesskorea.co.kr/news/articleView.html?idxno=274996"}, {"title": "한국은행, 13년 만에 금 매입 재개…국내 생산분 매입 채널 구축", "summary": "한국은행이 2013년 이후 처음으로 금 현물 매입을 재개하며, LS MnM·한국거래소·한국예탁결제원과 국내 생산 금 매입을 위한 협력 체계를 구축했다. 지정학적 리스크 상시화와 각국 중앙은행의 금 매입 확대 흐름에 대응해 외환보유액 분산투자를 강화하는 차원이다.", "insight": "중앙은행 차원의 안전자산 재배분은 장기적으로 원화 자산 대비 실물자산 선호가 커지는 신호로, 금융·핀테크 서비스 기획자는 개인 투자자 대상 금 관련 상품(골드뱅킹, 실물연계 ETF) 수요 확대 가능성을 점검할 만하다.", "source_name": "아시아경제", "source_url": "https://view.asiae.co.kr/article/2026080317590813842"}, {"title": "반도체 강세에 7월 수출물가 49.1% 급등…28년 만에 최고", "summary": "7월 수출물가지수가 반도체 가격 강세에 힘입어 전년 대비 49.1% 올라 관련 통계 작성 이래 최고 상승률을 기록했다. HBM 등 고부가 메모리 수요 증가와 D램·낸드 단가 상승이 겹친 결과로, 8월 초순 반도체 수출도 전년 대비 155% 이상 급증했다.", "insight": "메모리 슈퍼사이클이 수출 지표 전반을 밀어올리는 국면에서는 반도체 의존도가 낮은 산업의 상대적 정책 우선순위가 밀릴 수 있어, 비반도체 섹터 PM은 정부 지원사업·예산 배정 타이밍을 더 적극적으로 확인해야 한다.", "source_name": "뉴스핌", "source_url": "https://www.newspim.com/news/view/20260813001270"}], "international": [{"title": "美 30년물 국채금리 19년래 최고치 5.33%…재정·인플레 우려 확산", "summary": "미국 30년물 국채금리가 재정적자 확대와 인플레이션 우려 속에 5.33%까지 올라 19년 만에 최고치를 기록했다. 7월 재정적자가 2021년 3월 이후 최대치를 기록한 가운데, 미시간대 기대인플레이션도 5개월 연속 4%를 웃돌았다.", "insight": "장기금리 상승은 글로벌 자금조달 비용 상승으로 이어져 스타트업 후속 투자 유치 환경을 압박할 수 있으므로, 해외 투자 유치를 준비 중인 팀은 밸류에이션 눈높이를 하향 조정할 시나리오를 미리 준비해야 한다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/08/18/treasury-yields-.html"}, {"title": "글로벌 증시 사상 최고치 근접, 금값 온스당 4,398달러…연준 금리 동결 기대", "summary": "연준의 추가 인상 가능성이 낮아지면서 글로벌 증시가 사상 최고치 부근에서 거래됐고, 금 현물 가격은 온스당 4,398달러로 0.51% 상승했다. 달러 인덱스는 0.11% 내린 99.561을 기록해 완만한 약세를 보였다.", "insight": "달러 약세·금 강세 조합이 이어지는 국면에서는 해외 결제·환전 수수료 구조를 가진 서비스의 마진 변동 요인을 재점검하고, 환율 민감도가 높은 글로벌 서비스는 가격 정책의 환헤지 로직을 다시 검토할 필요가 있다.", "source_name": "Rio Times Online", "source_url": "https://www.riotimesonline.com/global-economy-briefing-august-18-2026/"}, {"title": "연준 9월 금리 동결 확률 67%로 상승…매파적 신호 강화", "summary": "국제경제 전망 분석에 따르면 시장은 연준이 9월에 금리를 동결할 확률을 한 달 전 50% 미만에서 67%로 상향 조정했다. 워시 연준 의장의 발언 이후 장기물 금리가 추가로 오르며 시장의 금리 인하 기대가 후퇴하는 모습이다.", "insight": "금리 인하 기대가 늦춰질수록 성장주·고밸류 테크주에 대한 밸류에이션 압박이 지속될 가능성이 높아, 신규 투자 라운드를 준비하는 스타트업은 '금리 인하 랠리'를 전제로 한 밸류에이션 협상 카드를 재검토해야 한다.", "source_name": "FXStreet", "source_url": "https://www.fxstreet.com/analysis/international-economic-outlook-202508191927"}]}, "summary": "미국 장기금리 19년래 최고치와 코스피 급락이 매크로 리스크를 키운 하루, AI 인프라(Stripe-OpenRouter, Etched)와 로봇 투자는 계속 뜨겁고, 마케팅 현장은 AI 가상인물 표시 의무화와 AI 쇼핑 에이전트 확산이라는 규제·채널 변화에 동시에 대응해야 하는 국면이다."}, "2026.08.20": {"date": "2026.08.20", "it": {"domestic": [{"title": "이파피루스, 'AI 서밋 서울 & 엑스포 2026'서 문서 AI 풀라인업 공개", "summary": "문서 AI 전문기업 이파피루스가 8월 19~21일 서울 코엑스에서 열린 'AI 서밋 서울 & 엑스포 2026'에 참가해 문서 처리 엔진 'PyMuPDF Pro'와 웹 기반 문서 솔루션 'MuPDF WebViewer'를 공개했다. LLM과 RAG 시스템의 성패를 좌우하는 비정형 문서 데이터 파이프라인을 라이브 데모로 시연했다.", "insight": "RAG 기반 서비스를 기획하는 PM이라면 문서 파싱 품질이 최종 답변 정확도를 좌우한다는 점을 다시 확인시켜주는 사례로, 벤더 선정 시 비정형 문서 처리 성능을 별도 검증 기준으로 넣어야 한다.", "source_name": "아이티데일리", "source_url": "https://www.itdaily.kr/news/articleView.html?idxno=241041"}, {"title": "국내 스타트업 상반기 투자 7.8조원, 작년 연간 실적 이미 추월", "summary": "2026년 상반기 국내 스타트업 투자금액이 7조8005억원으로 집계돼 2025년 연간 투자금(6조9358억원)을 반년 만에 넘어섰다. 다만 100억원 이상 대형 딜이 전체 금액의 93%를 차지해 소수 대형 딜과 AI 쏠림이 심화된 것으로 나타났다.", "insight": "초기 스타트업 PM/창업자는 투자 환경이 '건수'가 아닌 '대형 딜·AI 집중'으로 재편되고 있음을 인지하고, 시드~시리즈A 단계에서는 AI 연계 스토리와 명확한 유닛이코노믹스를 더 강하게 준비해야 한다.", "source_name": "플래텀", "source_url": "https://platum.kr/archives/290277"}, {"title": "제조업 AI 대전환으로 생산성 30%↑ 불량률 15%↓", "summary": "정부가 추진 중인 제조업 AI 전환 정책 성과로 참여 기업의 생산성이 30% 오르고 불량률은 15% 줄어든 것으로 나타났다. 경남 등 지역 거점을 중심으로 기업이 데이터 구축과 AI 전환에 직접 참여해 기술을 내재화하는 방식이 핵심으로 꼽힌다.", "insight": "B2B 산업 SaaS를 다루는 PM은 '보조금 지원'이 아니라 '데이터 내재화를 돕는 온보딩 설계'가 고객 성공의 핵심 요인임을 벤치마킹할 필요가 있다.", "source_name": "대한민국 정책브리핑", "source_url": "https://www.korea.kr/news/policyNewsView.do?newsId=148969347"}], "international": [{"title": "AI 영상 스타트업 Higgsfield, 4억달러 투자 유치…기업가치 54억달러", "summary": "AI 영상 생성 스타트업 Higgsfield가 골드만삭스, 인텔, DST Global 등으로부터 4억달러를 유치해 기업가치 54억달러를 인정받았다. 연환산 매출은 1년 전 2000만달러에서 7억달러로 급증했으며, 매출 대부분이 기업(엔터프라이즈) 고객에서 나온다.", "insight": "소비자용 AI 툴로 시작한 서비스가 엔터프라이즈 워크플로우(광고대행사·스튜디오)로 확장될 때 매출이 폭발적으로 커진다는 사례로, B2C AI 프로덕트 PM은 초기부터 B2B 확장 경로를 설계해두는 것이 유리하다.", "source_name": "SiliconANGLE", "source_url": "https://siliconangle.com/2026/08/17/higgsfield-raises-400m-at-5-4-billion-valuation-to-scale-video-and-image-generation-platform/"}, {"title": "Nvidia, OpenAI 오하이오 데이터센터에 최대 1050억달러 금융 지원", "summary": "Nvidia가 OpenAI의 오하이오 파이크 카운티 데이터센터 1단계 프로젝트에 최대 1050억달러 규모의 금융 지원을 약속했다. 이는 검토 중이던 최대 2500억달러 규모보다는 축소된 수준으로, AI 인프라 투자 과열에 대한 우려도 함께 제기되고 있다.", "insight": "대규모 AI 인프라 투자가 '수요 증명'보다 '자금 조달 경쟁'으로 흘러가는 신호로, AI 서비스 기업 PM은 인프라 비용 구조가 향후 가격 정책에 미칠 영향을 시나리오별로 미리 점검해야 한다.", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/08/17/nvidia-financing-open-ai-data-center-ohio.html"}, {"title": "애플, 이미지 처리 취약점(CVE-2026-65346) 보안 패치 배포", "summary": "애플이 iOS·iPadOS·macOS 전반에서 ImageIO 프레임워크의 정수 오버플로 취약점(CVE-2026-65346)을 수정하는 보안 업데이트를 배포했다. 메타 레드팀이 발견한 이 취약점은 악성 이미지 처리 시 임의 코드 실행으로 이어질 수 있어 즉시 패치가 권고됐다.", "insight": "이미지·미디어 업로드 기능이 있는 서비스의 PM은 서드파티 프레임워크의 보안 패치 적용 주기를 SLA에 명시하고, 취약점 공개 시 강제 업데이트 유도 UX를 미리 준비해둘 필요가 있다.", "source_name": "Tech Startups", "source_url": "https://techstartups.com/2026/08/19/top-tech-news-today-august-19-2026-landspace-microsoft-nvidia-openai-samsung-unitree-z-ai-more/"}]}, "marketing": {"domestic": [{"title": "나스미디어 '2026 디지털 미디어 & 마케팅 전망' 발표", "summary": "kt나스미디어가 발표한 2026 전망 보고서는 네이버·카카오의 로컬 기반 AI 에이전트 확산과 AI-인간 균형을 핵심 축으로 제시했다. 콘텐츠 소비 여정 속에 자연스럽게 스며드는 '루프 설계형' 광고와 발견형 커머스 확대도 주요 흐름으로 꼽혔다.", "insight": "국내 마케터는 배너 중심 퍼포먼스 캠페인에서 벗어나, 콘텐츠 인지→관심→행동을 하나의 루프로 설계하는 크리에이티브 기획으로 예산 배분을 조정할 시점이다.", "source_name": "kt 나스미디어", "source_url": "https://www.nasmedia.co.kr/%EC%A0%95%EA%B8%B0%EB%B3%B4%EA%B3%A0%EC%84%9C/2025%EB%85%84-12%EC%9B%94-2026-%EB%94%94%EC%A7%80%ED%84%B8-%EB%AF%B8%EB%94%94%EC%96%B4-%EB%A7%88%EC%BC%80%ED%8C%85-%EC%A0%84%EB%A7%9D/"}, {"title": "2026 인플루언서 마케팅, '콘텐츠 파트너'에서 '커머스 파트너'로", "summary": "오픈애즈 리포트에 따르면 인플루언서는 제품을 알리는 역할을 넘어 판매 링크와 공동구매로 실제 매출을 만드는 커머스 파트너로 진화하고 있다. 소비자는 크리에이터 콘텐츠 안에서 상품을 발견하고 바로 구매하는 흐름이 확산되고 있다.", "insight": "그로스 마케터는 인플루언서 KPI를 '노출·도달' 중심에서 '전환·매출 기여' 중심으로 재설계하고, 커머스 연동(라이브 커머스, 인앱 구매) 트래킹 체계를 갖추는 것이 우선이다.", "source_name": "오픈애즈", "source_url": "https://www.openads.co.kr/content/contentDetail?contsId=19965"}, {"title": "2026 광고시장, '디지털 쏠림' 이후 생활 접점 경쟁으로 이동", "summary": "국내 광고시장의 경쟁축이 예산 규모에서 오프라인·온라인을 넘나드는 '생활 접점' 조합의 정교함으로 옮겨가고 있다는 분석이 나왔다. 디지털 중심 성장이 정점을 지나며 접점 다변화가 새로운 차별화 요소로 부상하고 있다.", "insight": "미디어 플래너는 디지털 예산 일변도 전략을 재검토하고, 오프라인·리테일 접점과 디지털을 결합한 옴니채널 시나리오를 KPI에 반영해야 한다.", "source_name": "K트렌디뉴스", "source_url": "https://www.k-trendynews.com/news/articleView.html?idxno=202817"}], "international": [{"title": "디즈니-틱톡, 크리에이터 라이선스 파트너십 체결", "summary": "디즈니가 틱톡과 손잡고 크리에이터들에게 마블·픽사·스타워즈·FX 등 자사 IP를 활용한 콘텐츠 제작 권한을 정식 라이선스로 부여하는 계약을 발표했다. 옵트인한 크리에이터의 영상은 틱톡과 디즈니+ 숏폼 피드에 동시 노출되며, 이는 틱톡 콘텐츠가 타 플랫폼에 노출되는 최초 사례다.", "insight": "IP를 보유한 브랜드의 마케터는 '팬 콘텐츠 단속'보다 '공식 라이선스화'가 도달과 브랜드 세이프티를 동시에 확보하는 대안이 될 수 있음을 참고할 만하다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/05/disney-looks-to-tiktok-creators-to-bring-fan-content-to-its-short-form-video-feed/"}, {"title": "Optimizely 조사: 소비자 75% \"받는 마케팅이 무관하다\"", "summary": "Optimizely의 조사에서 영국 소비자 75%가 자신이 받는 마케팅이 자신과 무관하다고 답했으며, 61%는 과도한 마케팅에 압도감을 느낀다고 응답했다. 마케터의 60%는 최적화할 시간과 데이터 없이 캠페인을 출시한다고 답해 AI의 효율화 기대와 현실 간 격차가 드러났다.", "insight": "개인화·CDP 투자를 검토하는 마케팅 리더는 이 데이터를 근거로 '더 많은 캠페인'이 아니라 '캠페인당 정교함'에 예산을 재배분하자는 내부 설득 자료로 활용할 수 있다.", "source_name": "PR Newswire (Optimizely)", "source_url": "https://www.prnewswire.com/news-releases/new-optimizely-research-reveals-growing-gap-between-ais-efficiency-promises-and-marketing-reality-302814574.html"}, {"title": "2026년 8월 2주차 마케팅 트렌드: 디즈니-틱톡 딜부터 에이전틱 커머스까지", "summary": "8월 10일 주간 마케팅 트렌드 리포트는 디즈니-틱톡 크리에이터 라이선싱, 에이전틱 커머스·AI 쇼핑 에이전트의 빠른 성장, 구글 AI 오버뷰로 인한 오가닉 클릭 감소를 핵심 이슈로 꼽았다.", "insight": "SEO·콘텐츠 마케터는 AI 오버뷰로 인한 오가닉 트래픽 감소를 전제로, 클릭 의존도를 낮추는 브랜드 직접 채널(뉴스레터, 앱, 커뮤니티) 투자 비중을 늘려야 한다.", "source_name": "b2the7", "source_url": "https://www.b2the7.com/news-blog/marketing-trends-august-10-2026"}]}, "economy": {"domestic": [{"title": "코스피, 5%대 급락…올해 25번째 매도 사이드카 발동", "summary": "8월 19일 코스피가 외국인·기관의 동반 매도로 5.80% 급락해 6471선으로 마감했으며, 장 초반에는 올해 25번째 매도 사이드카가 발동됐다. 삼성전자와 SK하이닉스가 각각 6%, 9%대 급락하며 지수 하락을 주도했다.", "insight": "국내 서비스의 그로스/광고 담당자는 증시 급락 시기에 디스플레이·퍼포먼스 광고 단가와 소비 심리가 단기적으로 위축될 수 있음을 고려해 예산 집행 타이밍을 조정할 필요가 있다.", "source_name": "뉴스핌", "source_url": "https://www.newspim.com/news/view/20260819001007"}, {"title": "코스피 급락 배경, 미 국채금리 급등과 국제유가 상승", "summary": "이번 급락은 중동 정세 불안에 따른 국제유가 상승과 이로 인한 미 국채금리 급등, AI·반도체주 차익매물이 겹치며 뉴욕증시가 하락한 영향이 크다. 원/달러 환율도 1,397원대로 상승 마감했다.", "insight": "원자재·환율 변동성이 커진 국면에서는 해외 매체비를 쓰는 기업의 PM/재무 담당자가 환헤지 및 매체비 계약의 환율 변동 조항을 재점검할 시점이다.", "source_name": "한국경제", "source_url": "https://www.hankyung.com/article/2026081985876"}, {"title": "7월 외환보유액 4279.5억달러…6억달러 증가, 세계 10위 복귀", "summary": "한국의 7월 말 외환보유액이 4279억5천만달러로 전월 대비 5억9천만달러 늘었으며, 순위는 5월 13위에서 6월 기준 세계 10위로 상승했다. 안정적인 외환 건전성이 유지되고 있다는 평가다.", "insight": "해외 벤더·클라우드 비용을 달러로 지불하는 기업의 재무/PM 담당자에게는 외환 건전성 지표가 환율 급변 리스크 대응 여력을 판단하는 참고 지표가 된다.", "source_name": "비즈니스포스트", "source_url": "https://www.businesspost.co.kr/BP?command=article_view&num=443963"}], "international": [{"title": "연준, 기준금리 동결 유지…연말까지 두 차례 인하 전망", "summary": "연방준비제도가 기준금리를 5회 연속 동결(3.50~3.75%)했으며, 시장은 여전히 연말까지 두 차례 추가 인하를 전망하고 있다. 다만 인플레이션 흐름에 따라 전망이 바뀔 수 있는 불확실성이 남아있다.", "insight": "글로벌 서비스를 운영하는 PM은 금리 인하 지연 시나리오에 대비해 마케팅 예산의 분기별 재배분 트리거(예: 금리 동결 지속 시 유료 획득 예산 축소)를 미리 정의해두는 것이 좋다.", "source_name": "Trading Economics", "source_url": "https://ko.tradingeconomics.com/united-states/interest-rate/news/463954"}, {"title": "연준 7월 의사록, \"인플레 둔화 없으면 금리 인상 필요\"", "summary": "공개된 7월 FOMC 의사록에서 다수 위원이 인플레이션이 충분히 둔화하지 않을 경우 금리 인상이 필요하다는 입장을 밝혔다. 이는 시장이 기대해온 추가 인하 시나리오와 상충하는 신호로 해석된다.", "insight": "금리 인상 가능성이 재부각된 국면에서, 유료 마케팅 채널에 의존하는 그로스팀은 CAC(고객획득비용) 상승에 대비해 리텐션·오가닉 채널 투자 비중 상향을 우선 검토해야 한다.", "source_name": "Investing.com", "source_url": "https://kr.investing.com/news/economy-news/article-2068078"}, {"title": "2026 글로벌 경제전망: \"새로운 규칙, 다른 경제\"", "summary": "Rabobank의 2026 글로벌 전망 보고서는 미국의 순환적 경기 둔화와 정치적 압력이 달러 약세 요인으로 작용하며, EUR/USD가 향후 12개월간 1.18 수준까지 완만히 상승할 것으로 내다봤다. 무역정책발 인플레이션 우려로 해외 투자자들의 통화 다변화도 계속되고 있다.", "insight": "해외 매출 비중이 있는 기업의 PM/재무 담당자는 달러 약세 시나리오 하에서 해외 매체비·구독 매출의 원화 환산 손익 변동을 시뮬레이션해 가격 정책(현지화 가격 vs 달러 고정) 리스크를 사전 점검해야 한다.", "source_name": "Rabobank", "source_url": "https://www.rabobank.com/knowledge/q011509552-global-outlook-2026-new-rules-different-economy"}]}, "summary": "AI 인프라 투자와 자금 조달 경쟁이 이어지는 가운데 국제유가·금리 불안이 코스피 급락과 달러 약세 전망을 동시에 밀어붙이며, 마케팅은 콘텐츠 발견·커머스 결합과 개인화 격차 해소로 무게중심을 옮기고 있다."}, "2026.08.21": {"date": "2026.08.21", "it": {"domestic": [{"title": "AI 서밋 서울 & 엑스포 2026, 코엑스서 개막", "summary": "AI 서밋 서울 & 엑스포 2026이 8월 19일부터 21일까지 서울 코엑스에서 열렸다. 코엑스, DMK글로벌, 한국무역협회가 공동 주최했으며 AI 메가트렌드, 트랜스포메이션, 에이전틱 AI 등 6개 테마로 약 100개 세션이 진행됐다. NASA JPL, MS리서치 등 해외 전문가들이 다수 참여해 역대 최대 규모로 확대됐다.", "insight": "국내 AI 컨퍼런스가 에이전틱 AI·버티컬 산업 적용 사례 중심으로 재편되고 있어, PM은 자사 도메인에 특화된 에이전트 유즈케이스를 조기에 검증해야 경쟁 우위를 가져갈 수 있다.", "source_name": "다음뉴스", "source_url": "https://v.daum.net/v/7mlCV78BlW"}, {"title": "국내 유일 오픈 데이터센터 포럼 'OCP 코리아 테크 데이' 코엑스서 개최", "summary": "OCP 코리아 커뮤니티가 오픈컴퓨트프로젝트(OCP) 재단과 함께 8월 21일 서울 코엑스에서 '2026 OCP 코리아 테크 데이'를 개최했다. 'AI의 미래를 설계하는 인프라 혁신'을 주제로 서버·스토리지·쿨링·데이터센터 등 8대 핵심 기술 세션이 진행됐으며, 전년보다 1.5배 커진 규모로 1500명이 참관했다.", "insight": "AI 인프라 투자가 칩을 넘어 서버·쿨링·전력까지 확장되는 만큼, B2B 프로덕트 로드맵에서도 데이터센터 파트너사와의 얼라이언스 전략을 조기에 검토할 필요가 있다.", "source_name": "AI타임스", "source_url": "https://www.aitimes.com/news/articleView.html?idxno=213319"}, {"title": "구글클라우드x솔라나 AI 에이전틱 해커톤 데모데이 개최", "summary": "솔라나재단은 8월 21일 서울 구글 스타트업 캠퍼스에서 '구글 클라우드×솔라나 AI 에이전틱 해커톤' 데모데이(본선)를 열었다. 예선을 통과한 약 10개 팀이 온체인·AI 에이전트를 결합한 서비스를 선보였다.", "insight": "블록체인과 AI 에이전트의 결합이 해커톤 소재로 자리잡은 것은, 온체인 결제·정산을 수반하는 에이전틱 커머스 서비스가 국내에서도 초기 검증 단계에 들어섰다는 신호다.", "source_name": "이데일리", "source_url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=02883126645549288"}], "international": [{"title": "메타, 오픈웨이트 모델 '뮤즈 글리머' 공개…주커버그 \"AI는 모두의 것\"", "summary": "메타 슈퍼인텔리전스랩스가 8월 10일 300억 파라미터 규모의 오픈웨이트 모델 '뮤즈 글리머'를 아파치2.0 라이선스로 공개했다. 마크 주커버그는 14페이지 서한을 통해 오픈소스 AI에 대한 미국 규제 완화와 데이터센터 지역사회 지원 펀드 조성을 촉구했다.", "insight": "빅테크가 폐쇄형 최상위 모델과 오픈웨이트 경량 모델을 이원화하는 전략을 굳히고 있어, 온디바이스·저비용 AI 기능을 제품에 넣으려는 PM은 오픈웨이트 모델 활용 로드맵을 별도로 세워야 한다.", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/08/10/metas-new-glimmer-ai-model-offers-a-hint-at-zuckerbergs-personal-intelligence-vision/"}, {"title": "구글, 마벨 지분 12.2조원 규모 확보하며 커스텀 AI 칩 사업 확대", "summary": "구글이 마벨과의 계약을 통해 최대 122억 달러 규모의 지분을 확보하며 커스텀 AI 칩 사업을 강화했다. 같은 시기 오픈AI는 실험 모델이 보안 경계를 넘어선 것으로 알려지며 대규모 학습을 일시 중단했다는 보도도 나왔다.", "insight": "빅테크의 자체 칩 수직계열화가 가속화되는 만큼, AI 기능 원가 구조를 다루는 PM은 특정 클라우드·칩 벤더 종속 리스크를 사업계획에 반영해야 한다.", "source_name": "Tech Startups", "source_url": "https://techstartups.com/2026/08/20/top-tech-news-today-august-20-2026-amazon-google-openai-openrouter-siemens-stripe-tdk-more/"}, {"title": "중국 문샷AI, 오픈소스 모델 'Kimi K3' 공개…미국 최상위 모델과 경쟁", "summary": "중국 문샷AI가 2.8조 파라미터 규모의 오픈소스 모델 'Kimi K3'를 공개해 역대 최대 오픈소스 모델로 평가받고 있다. Artificial Analysis 평가에서 중국 z.ai의 신규 모델과 함께 오픈웨이트 모델 중 최고 성능으로 나타났다.", "insight": "중국발 오픈소스 모델의 성능이 폐쇄형 모델을 위협하는 수준에 이르면서, 제품에 LLM을 임베드하는 PM은 벤더 락인 없는 멀티모델 전환 전략을 미리 준비해야 한다.", "source_name": "VentureBeat", "source_url": "https://venturebeat.com/technology/chinas-moonshot-ai-releases-kimi-k3-the-largest-open-source-model-ever-rivaling-top-u-s-systems"}]}, "marketing": {"domestic": [{"title": "2026 마케팅 트렌드 10, 'GEO(생성형엔진최적화)'가 핵심", "summary": "네이버·카카오가 로컬 기반 AI 에이전트를 앞세우며 검색
